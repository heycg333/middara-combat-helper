<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Middara Helper" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <title>Middara Combat Helper - V3.0A Clean Shell</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #182235;
      --panel2: #212f46;
      --card: rgba(15, 23, 42, .62);
      --card2: rgba(2, 6, 23, .32);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --dim: #94a3b8;
      --line: rgba(255,255,255,.14);
      --accent: #38bdf8;
      --accent2: #a3e635;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --input: #0b1220;
      --shadow: 0 18px 40px rgba(0,0,0,.32);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 0 0, #23344f, #0f172a 44%, #070b13 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.42;
      padding-bottom: 96px;
    }
    header, main { width: min(1240px, 100%); margin: 0 auto; }
    header { padding: 18px 14px 10px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 3vw, 2.55rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 10px; font-size: 1.08rem; }
    h3 { margin: 0 0 8px; font-size: .98rem; color: var(--accent); }
    p { margin: 0 0 10px; }
    .subtitle { color: var(--muted); max-width: 960px; }
    main { padding: 0 14px 34px; display: grid; gap: 14px; }
    .nav { position: sticky; top: 0; z-index: 50; padding: 8px; margin: 0 14px 8px; background: rgba(15,23,42,.94); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
    .nav button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 820px) { .nav { grid-template-columns: repeat(4, minmax(0,1fr)); border-radius: 18px; } }
    .panel { background: linear-gradient(180deg, rgba(255,255,255,.046), rgba(255,255,255,.018)), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .panel.soft { background: var(--panel2); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .card.selected { border-color: rgba(56,189,248,.72); background: rgba(56,189,248,.10); }
    .card.danger { border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.08); }
    .card.ok { border-color: rgba(52,211,153,.5); background: rgba(52,211,153,.08); }
    .flow-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; align-items: start; }
    @media (max-width: 760px) { .flow-grid { grid-template-columns: 1fr; } }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .field-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    @media (max-width: 860px) { .field-grid, .field-grid.three, .grid.two, .grid.three { grid-template-columns: 1fr; } }
    label { display: block; color: var(--muted); font-size: .86rem; margin: 0 0 5px; }
    input, select, textarea, button { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--input); color: var(--text); font: inherit; font-size: 16px; padding: 10px 11px; }
    textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; }
    button { cursor: pointer; font-weight: 800; background: #334155; }
    button:hover { filter: brightness(1.08); }
    button.primary { background: linear-gradient(180deg, #22c55e, #15803d); border-color: rgba(34,197,94,.52); }
    button.accent { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #06111f; border-color: rgba(56,189,248,.52); }
    button.warn { background: linear-gradient(180deg, #fbbf24, #d97706); color: #111827; border-color: rgba(251,191,36,.52); }
    button.danger { background: linear-gradient(180deg, #fb7185, #be123c); color: #fff; border-color: rgba(251,113,133,.55); }
    button.ghost { background: rgba(15,23,42,.55); color: var(--muted); }
    button.active, .nav button.active { background: linear-gradient(180deg, #38bdf8, #0ea5e9); color: #05131f; border-color: rgba(56,189,248,.7); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn-row button { width: auto; min-width: 112px; }
    .compact-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .compact-actions button { width: auto; min-width: 0; padding: 7px 9px; font-size: .84rem; }
    .note { color: var(--muted); font-size: .9rem; }
    .tiny { color: var(--dim); font-size: .78rem; }
    .pillbox { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); background: rgba(15,23,42,.54); border-radius: 999px; padding: 5px 8px; color: var(--muted); font-size: .8rem; }
    .pill strong { color: var(--text); }
    .hr { height: 1px; background: var(--line); margin: 12px 0; }
    .entity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 10px; }
    .entity-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .entity-head strong { overflow-wrap: anywhere; }
    .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar span { display:block; height:100%; background: var(--accent); }
    .bar.danger span { background: var(--danger); }
    .effects { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 22px; }
    .effect { border: 1px solid rgba(163,230,53,.34); color: #d9f99d; background: rgba(163,230,53,.08); border-radius: 999px; padding: 3px 7px; font-size: .74rem; }
    .token { border-color: rgba(56,189,248,.35); color: #bae6fd; background: rgba(56,189,248,.08); }
    .live-title { display:flex; justify-content:space-between; gap:10px; align-items:start; flex-wrap:wrap; }
    .status-line { min-height: 45px; display: flex; align-items: center; border: 1px solid rgba(56,189,248,.25); background: rgba(56,189,248,.07); border-radius: 14px; padding: 10px 12px; color: var(--muted); }
    .footer { position: fixed; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 70; width: min(1210px, calc(100% - 20px)); margin: 0 auto; background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.98)); border: 1px solid rgba(56,189,248,.35); border-radius: 18px; padding: 10px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; box-shadow: 0 16px 42px rgba(0,0,0,.45); }
    .footer-title { font-weight: 900; }
    .footer-detail { color: var(--muted); font-size: .84rem; }
    .footer-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .footer-actions button { width:auto; min-width:82px; padding: 8px 10px; font-size:.85rem; }
    @media (max-width: 680px) { .footer { grid-template-columns: 1fr; } .footer-actions { justify-content:flex-start; } body { padding-bottom: 154px; } }
    .initiative-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:10px; }
    .initiative-card.current { border-color: rgba(56,189,248,.75); background: rgba(56,189,248,.09); }
    .num { width:28px; height:28px; display:grid; place-items:center; border-radius:999px; background: rgba(255,255,255,.1); color:var(--muted); font-weight:900; }
    .current .num { background:var(--accent); color:#06111f; }
    details { border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:rgba(15,23,42,.48); }
    summary { cursor:pointer; color:var(--accent); font-weight:900; }
    .table-ish { display:grid; gap:8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Middara Combat Helper</h1>
    <div class="subtitle"><strong>V3.0A Clean Shell</strong> - a fresh, Play-first rebuild with one central state owner. This first V3 build intentionally excludes combat math so we can validate layout, navigation, trackers, initiative, snapshots, and PWA deployment without legacy patch conflicts.</div>
  </header>
  <main id="appRoot"></main>
  <footer class="footer" id="stableFooter" aria-live="polite"></footer>
  <script>
(function () {
  'use strict';
  const VERSION = 'V3.0A';
  const STORAGE_KEY = 'middara.combatHelper.v3.state';

  const DATA = {
    party: {
      rook: { id:'rook', name:'Rook', hp:26, recovery:3, maxSp:5, defense:13, armor:5, movement:7, tags:['Adventurer'], note:'High armor front line; Rook defense will return in a later V3 module.' },
      remi: { id:'remi', name:'Remi', hp:32, recovery:3, maxSp:5, defense:12, armor:1, movement:6, tags:['Adventurer'], note:'Chain Pick / Scimitar / Whirlwind helpers return after core attack is stable.' },
      nightingale: { id:'nightingale', name:'Nightingale', hp:32, recovery:3, maxSp:5, defense:13, armor:1, movement:7, tags:['Adventurer'], note:'Life Grasp and Loyal Esper tools return as a clean V3 component.' },
      zeke: { id:'zeke', name:'Zeke', hp:24, recovery:3, maxSp:5, defense:13, armor:1, movement:7, tags:['Adventurer'], note:'Onslaught / Blade Works helpers return after core attack is stable.' }
    },
    enemyDefinitions: {
      animate: { id:'animate', name:'Animate', hp:30, defense:13, armor:3, movement:6, conviction:['Teal','Green'], tags:['Intelligent'] },
      merk_hound: { id:'merk_hound', name:'Merk Hound', hp:18, defense:14, armor:0, movement:6, conviction:['Teal','Green'], tags:['Intelligent','Aquatic'] },
      fragor: { id:'fragor', name:'Fragor', hp:16, defense:13, armor:0, movement:4, conviction:['Teal','Orange'], tags:['Intelligent','Insect','Swarm'] },
      adlet_drudge: { id:'adlet_drudge', name:'Adlet Drudge', hp:18, defense:12, armor:0, movement:8, conviction:['Teal','Red'], tags:['Intelligent','Adlet','Swarm'], immunities:['Darkness','Poison','Sedate'] },
      earth_loa_itlum: { id:'earth_loa_itlum', name:'Earth Loa - Itlum Rich', hp:36, defense:12, armor:5, movement:4, conviction:['Teal','Teal'], tags:['Intelligent','Loa','Variation'], immunities:['Darkness','Sedate'] }
    },
    commandDefinitions: {
      agares: { id:'agares', name:'Agares', hp:32, recovery:3, maxSp:5, defense:13, armor:4, movement:4, soi:4, tags:['Loyal Esper','Command','Squeeze'] },
      eliphie: { id:'eliphie', name:'Eliphie', hp:32, recovery:3, maxSp:5, defense:13, armor:0, movement:6, soi:4, tags:['Loyal Esper','Command'] }
    },
    effects: ['Darkness','Condemn','Disease','Paralyze','Poison','Wilt','Sedate','Barrier','Courage','Haste','Tether','Nemesis'],
    tokens: ['Dodge','Heal','Intervention','Vow','Summon','Energy']
  };

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function byId(id) { return document.getElementById(id); }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function uid(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
  function nowStamp() { return new Date().toLocaleString(); }

  function defaultParty() {
    const party = {};
    Object.values(DATA.party).forEach(p => {
      party[p.id] = { id:p.id, damage:0, sp:p.recovery, effects:[], tokens:{} };
    });
    return party;
  }
  function defaultState() {
    return {
      schema: 'middara-v3-clean-shell',
      version: VERSION,
      createdAt: new Date().toISOString(),
      ui: { activeTab:'play', actorId:'party:rook', targetId:null, targetScope:'enemies', actionId:null, selectedParty:'rook' },
      party: defaultParty(),
      enemies: [],
      command: [],
      initiative: {
        round: 1,
        currentIndex: 0,
        cards: [
          { id: uid('init'), type:'party', ref:'rook', label:'Rook' },
          { id: uid('init'), type:'party', ref:'remi', label:'Remi' },
          { id: uid('init'), type:'party', ref:'nightingale', label:'Nightingale' },
          { id: uid('init'), type:'party', ref:'zeke', label:'Zeke' }
        ]
      },
      rewards: { gold:0, xp:0, notes:'' },
      settings: { autoAddEnemyInitiative:true, autoAddCommandInitiative:true },
      log: []
    };
  }
  let state = loadState();

  function mergeState(raw) {
    const base = defaultState();
    const next = Object.assign(base, raw || {});
    next.ui = Object.assign(base.ui, raw?.ui || {});
    next.party = Object.assign(base.party, raw?.party || {});
    next.initiative = Object.assign(base.initiative, raw?.initiative || {});
    next.rewards = Object.assign(base.rewards, raw?.rewards || {});
    next.settings = Object.assign(base.settings, raw?.settings || {});
    next.enemies = Array.isArray(raw?.enemies) ? raw.enemies : [];
    next.command = Array.isArray(raw?.command) ? raw.command : [];
    next.log = Array.isArray(raw?.log) ? raw.log : [];
    next.version = VERSION;
    return next;
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return mergeState(JSON.parse(raw));
    } catch (err) {
      console.warn('Failed to load state', err);
      return defaultState();
    }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { console.warn('Failed to save state', err); }
  }
  function setState(mutator, opts={}) {
    mutator(state);
    normalizeState();
    saveState();
    render();
    if (opts.log) addLog(opts.log, opts.detail || '');
  }
  function addLog(title, detail='') {
    state.log.unshift({ id:uid('log'), time:nowStamp(), title, detail });
    state.log = state.log.slice(0, 80);
    saveState();
    render();
  }
  function normalizeState() {
    if (!state.ui) state.ui = defaultState().ui;
    if (!DATA.party[state.ui.selectedParty]) state.ui.selectedParty = 'rook';
    if (!state.initiative.cards.length) state.initiative.currentIndex = 0;
    if (state.initiative.currentIndex >= state.initiative.cards.length) state.initiative.currentIndex = Math.max(0, state.initiative.cards.length - 1);
    if (!state.ui.actorId) syncActorFromInitiative(false);
  }

  function currentInitiativeCard() { return state.initiative.cards[state.initiative.currentIndex] || null; }
  function actorLabel(actorId = state.ui.actorId) {
    if (!actorId) return 'No actor';
    const [type, id] = actorId.split(':');
    if (type === 'party') return DATA.party[id]?.name || id;
    if (type === 'enemy') return state.enemies.find(e => e.id === id)?.label || 'Enemy';
    if (type === 'command') return state.command.find(c => c.id === id)?.label || 'Command Combatant';
    return actorId;
  }
  function actorKind(actorId = state.ui.actorId) { return (actorId || '').split(':')[0] || 'none'; }
  function getActor(actorId = state.ui.actorId) {
    const [type, id] = (actorId || ':').split(':');
    if (type === 'party') return { type, id, def: DATA.party[id], state: state.party[id] };
    if (type === 'enemy') { const s = state.enemies.find(e => e.id === id); return { type, id, def: DATA.enemyDefinitions[s?.defId], state:s }; }
    if (type === 'command') { const s = state.command.find(c => c.id === id); return { type, id, def: DATA.commandDefinitions[s?.defId], state:s }; }
    return { type:'none' };
  }
  function targetLabel(targetId = state.ui.targetId) {
    if (!targetId) return 'No target selected';
    const [type, id] = targetId.split(':');
    if (type === 'party') return DATA.party[id]?.name || id;
    if (type === 'enemy') return state.enemies.find(e => e.id === id)?.label || 'Enemy';
    if (type === 'command') return state.command.find(c => c.id === id)?.label || 'Command Combatant';
    return targetId;
  }
  function actionLabel(actionId = state.ui.actionId) {
    const labels = { attack:'Attack', spell:'Spell / Force', enemyAttack:'Enemy Attack', support:'Support', summon:'Summon Esper', whirlwind:'Whirlwind', onslaught:'Onslaught', bladeWorks:'Blade Works', wait:'Manual / reminder' };
    return labels[actionId] || 'Choose action';
  }
  function currentFooterText() {
    const actor = actorLabel();
    const action = actionLabel();
    const target = targetLabel();
    return { title: `${actor} - ${action}`, detail: state.ui.targetId ? `Target: ${target}. V3.0A is a stable shell; combat math returns in V3.0C/D.` : 'Choose a target, then an action. Combat math is intentionally disabled in V3.0A.' };
  }

  function actorOptionsHtml() {
    const opts = [];
    Object.values(DATA.party).forEach(p => opts.push({ value:`party:${p.id}`, label:p.name }));
    state.command.filter(c => !c.defeated && !c.dismissed).forEach(c => opts.push({ value:`command:${c.id}`, label:c.label }));
    state.enemies.filter(e => !e.defeated).forEach(e => opts.push({ value:`enemy:${e.id}`, label:e.label }));
    return opts.map(o => `<option value="${escapeHtml(o.value)}" ${state.ui.actorId===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
  }
  function selectActor(actorId) {
    state.ui.actorId = actorId;
    state.ui.actionId = null;
    const actor = getActor(actorId);
    if (actor.type === 'party') state.ui.selectedParty = actor.id;
    saveState(); render();
  }
  function selectTarget(targetId) {
    state.ui.targetId = targetId;
    saveState(); render();
  }
  function syncActorFromInitiative(doRender=true) {
    const card = currentInitiativeCard();
    if (!card) return;
    let actorId = null;
    if (card.type === 'party') actorId = `party:${card.ref}`;
    if (card.type === 'command') {
      const c = state.command.find(x => x.defId === card.ref && !x.defeated && !x.dismissed);
      if (c) actorId = `command:${c.id}`;
    }
    if (card.type === 'enemy') {
      const e = state.enemies.find(x => x.defId === card.ref && !x.defeated);
      if (e) actorId = `enemy:${e.id}`;
    }
    if (actorId) state.ui.actorId = actorId;
    if (doRender) { saveState(); render(); }
  }

  function hpBar(current, max) {
    const pct = max ? Math.max(0, Math.min(100, 100 * (max-current) / max)) : 0;
    return `<div class="bar ${current >= max ? 'danger' : ''}"><span style="width:${pct}%"></span></div>`;
  }
  function renderEffects(entity, type, id) {
    const effects = (entity.effects || []).map(e => `<span class="effect">${escapeHtml(e)}</span>`).join('');
    const tokens = Object.entries(entity.tokens || {}).filter(([,n]) => n>0).map(([k,n]) => `<span class="effect token">${escapeHtml(k)} x${n}</span>`).join('');
    return `<div class="effects">${effects || '<span class="tiny">No effects</span>'}${tokens}</div>`;
  }
  function entityStatPills(def, st) {
    const hp = def.hp || 0;
    const dmg = st.damage || 0;
    const sp = st.sp != null ? `<span class="pill"><strong>SP</strong> ${st.sp}/${def.maxSp || '-'}</span>` : '';
    return `<div class="pillbox" style="margin-top:8px"><span class="pill"><strong>HP</strong> ${Math.max(0,hp-dmg)} / ${hp}</span>${sp}<span class="pill"><strong>Def</strong> ${def.defense ?? '-'}</span><span class="pill"><strong>Arm</strong> ${def.armor ?? 0}</span></div>`;
  }

  function render() {
    const root = byId('appRoot');
    root.innerHTML = renderNav() + renderActiveTab();
    renderFooter();
  }
  function renderNav() {
    const tabs = [ ['play','Play'], ['party','Party'], ['enemies','Enemies'], ['turn','Turn'], ['command','Command'], ['rewards','Rewards'], ['data','Data'] ];
    return `<section class="nav">${tabs.map(([id,label]) => `<button type="button" class="${state.ui.activeTab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</section>`;
  }
  function renderActiveTab() {
    switch (state.ui.activeTab) {
      case 'party': return renderPartyTab();
      case 'enemies': return renderEnemiesTab();
      case 'turn': return renderTurnTab();
      case 'command': return renderCommandTab();
      case 'rewards': return renderRewardsTab();
      case 'data': return renderDataTab();
      default: return renderPlayTab();
    }
  }
  function renderFooter() {
    const f = currentFooterText();
    byId('stableFooter').innerHTML = `<div><div class="footer-title">${escapeHtml(f.title)}</div><div class="footer-detail">${escapeHtml(f.detail)}</div></div><div class="footer-actions"><button type="button" class="primary" data-action="log-current">Log</button><button type="button" data-action="tab" data-tab="play">Play</button><button type="button" class="ghost" data-action="sync-actor">Sync</button></div>`;
  }

  function renderPlayTab() {
    return `<section class="panel" id="playPanel">
      <div class="live-title"><div><h2>V3.0A stable Play flow</h2><div class="note">One visible owner for Actor, Target, Action, and Resolve. No legacy patch panels, no probability, no enemy AI, no repaint loops.</div></div><span class="pill"><strong>Current</strong> ${escapeHtml(currentInitiativeCard()?.label || 'No initiative')}</span></div>
      <div class="flow-grid" style="margin-top:12px">
        <div class="card"><h3>1. Actor</h3>${renderActorCard()}</div>
        <div class="card"><h3>2. Target drawer</h3>${renderTargetDrawer()}</div>
        <div class="card"><h3>3. Action</h3>${renderActionCard()}</div>
        <div class="card"><h3>4. Resolve / apply</h3>${renderResolveCard()}</div>
      </div>
    </section>
    <section class="grid two">
      <div class="panel"><h2>Fast party</h2><div class="entity-grid">${Object.keys(DATA.party).map(renderPartyCard).join('')}</div></div>

  function getEntityByTarget(targetId) {
    const [type,id] = (targetId||':').split(':');
    if (type==='party') return { type, id, def:DATA.party[id], state:state.party[id] };
    if (type==='enemy') { const st=state.enemies.find(e=>e.id===id); return { type, id, def:DATA.enemyDefinitions[st?.defId], state:st }; }
    if (type==='command') { const st=state.command.find(c=>c.id===id); return { type, id, def:DATA.commandDefinitions[st?.defId], state:st }; }
    return null;
  }
  function lowestAvailableNumber(defId) {
    const used = new Set(state.enemies.filter(e => e.defId===defId && !e.defeated).map(e=>e.number).filter(Boolean));
    let n = 1; while (used.has(n)) n += 1; return n;
  }
  function insertInitiativeCard(card) {
    const cards = state.initiative.cards;
    const idx = cards.length ? Math.min(state.initiative.currentIndex + 1, cards.length) : 0;
    cards.splice(idx, 0, card);
  }
  function ensureEnemyInitiative(defId) {
    if (!state.settings.autoAddEnemyInitiative) return;
    if (state.initiative.cards.some(c => c.type==='enemy' && c.ref===defId)) return;
    const def = DATA.enemyDefinitions[defId];
    insertInitiativeCard({ id:uid('init'), type:'enemy', ref:defId, label:def.name });
  }
  function ensureCommandInitiative(defId) {
    if (!state.settings.autoAddCommandInitiative) return;
    if (state.initiative.cards.some(c => c.type==='command' && c.ref===defId)) return;
    const def = DATA.commandDefinitions[defId];
    insertInitiativeCard({ id:uid('init'), type:'command', ref:defId, label:def.name });
  }
  function addEnemies(defId, count=1) {
    const def = DATA.enemyDefinitions[defId];
    for (let i=0;i<count;i++) {
      const n = lowestAvailableNumber(defId);
      state.enemies.push({ id:uid('enemy'), defId, number:n, label:`${def.name} ${n}`, damage:0, effects:[], tokens:{}, defeated:false });
    }
    ensureEnemyInitiative(defId);
    saveState(); render();
  }
  function summonCommand(defId) {
    const def = DATA.commandDefinitions[defId];
    const count = state.command.filter(c=>c.defId===defId).length + 1;
    const cmd = { id:uid('cmd'), defId, label: count>1 ? `${def.name} ${count}` : def.name, damage:0, sp:def.recovery, effects:[], tokens:{}, defeated:false, dismissed:false };
    state.command.push(cmd);
    if (state.party.nightingale) state.party.nightingale.tokens.Summon = (state.party.nightingale.tokens.Summon || 0) + 1;
    ensureCommandInitiative(defId);
    state.ui.actorId = `command:${cmd.id}`;
    state.ui.targetId = null;
    state.ui.actionId = null;
    saveState(); render();
    addLog(`Summoned ${def.name}`, 'Placement and SOI were handled manually. Added a Summon token reminder to Nightingale.');
  }
  function addEffectToEntity(ent, effect) {
    if (!ent || !ent.state || !effect) return;
    const immunities = ent.def?.immunities || [];
    if (immunities.includes(effect)) { addLog('Effect blocked by immunity', `${ent.def.name} is immune to ${effect}.`); return; }
    if (!ent.state.effects.includes(effect)) ent.state.effects.push(effect);
  }
  function removeEffectFromEntity(ent, effect) {
    if (!ent?.state || !effect) return;
    ent.state.effects = ent.state.effects.filter(e => e !== effect);
  }
  function addTokenToEntity(ent, token) {
    if (!ent?.state || !token) return;
    ent.state.tokens[token] = (ent.state.tokens[token] || 0) + 1;
  }
  function removeTokenFromEntity(ent, token) {
    if (!ent?.state || !token) return;
    ent.state.tokens[token] = Math.max(0, (ent.state.tokens[token] || 0) - 1);
    if (ent.state.tokens[token] <= 0) delete ent.state.tokens[token];
  }

  document.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    if (a === 'tab') { state.ui.activeTab = btn.dataset.tab; saveState(); render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    if (a === 'sync-actor') { syncActorFromInitiative(); return; }
    if (a === 'target-scope') { state.ui.targetScope = btn.dataset.scope; saveState(); render(); return; }
    if (a === 'select-target') { selectTarget(btn.dataset.target); return; }
    if (a === 'select-actor') { selectActor(btn.dataset.actor); return; }
    if (a === 'target-attack') { state.ui.targetId = btn.dataset.target; state.ui.actionId = 'attack'; saveState(); render(); return; }
    if (a === 'set-action') { state.ui.actionId = btn.dataset.actionId; saveState(); render(); return; }
    if (a === 'log-current') { addLog(`${actorLabel()} - ${actionLabel()}`, `Target: ${targetLabel()}. V3.0A logged the flow only.`); return; }
    if (a === 'add-enemy-quick') { const defId = byId('quickEnemyDef')?.value || 'animate'; const count = Math.max(1, Number(byId('quickEnemyCount')?.value || 1)); state.settings.autoAddEnemyInitiative = !!byId('quickEnemyInitiative')?.checked; addEnemies(defId, count); return; }
    if (a === 'party-damage') { const st=state.party[btn.dataset.id]; st.damage=Math.max(0, st.damage + Number(btn.dataset.delta)); saveState(); render(); return; }
    if (a === 'party-sp') { const st=state.party[btn.dataset.id]; const def=DATA.party[btn.dataset.id]; st.sp=Math.max(0, Math.min(def.maxSp, st.sp + Number(btn.dataset.delta))); saveState(); render(); return; }
    if (a === 'party-add-effect') { const id=btn.dataset.id; addEffectToEntity({type:'party', id, def:DATA.party[id], state:state.party[id]}, document.querySelector(`[data-select="party-effect-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-remove-effect') { const id=btn.dataset.id; removeEffectFromEntity({state:state.party[id]}, document.querySelector(`[data-select="party-effect-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-add-token') { const id=btn.dataset.id; addTokenToEntity({state:state.party[id]}, document.querySelector(`[data-select="party-token-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-remove-token') { const id=btn.dataset.id; removeTokenFromEntity({state:state.party[id]}, document.querySelector(`[data-select="party-token-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'prepare-party') { Object.keys(state.party).forEach(id => { const def=DATA.party[id], st=state.party[id]; const half=Math.floor(def.hp/2); if (st.damage > half) st.damage = half; st.sp = def.recovery; st.effects = []; }); saveState(); render(); addLog('Prepared party', 'Removed Effects, set SP to recovery, and preserved Ability Tokens.'); return; }
    if (a === 'restore-party') { Object.keys(state.party).forEach(id => { const def=DATA.party[id], st=state.party[id]; st.damage=0; st.sp=def.recovery; st.effects=[]; st.tokens={}; }); state.command=[]; saveState(); render(); addLog('Restored party', 'Removed damage, Effects, Ability Tokens, and cleared Command Combatants.'); return; }
    if (a === 'enemy-damage') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ const def=DATA.enemyDefinitions[e.defId]; e.damage=Math.max(0, Math.min(def.hp, e.damage + Number(btn.dataset.delta))); if(e.damage>=def.hp) e.defeated=true; saveState(); render(); } return; }
    if (a === 'toggle-enemy-defeated') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ e.defeated=!e.defeated; saveState(); render(); } return; }
    if (a === 'enemy-add-effect') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ addEffectToEntity({type:'enemy', id:e.id, def:DATA.enemyDefinitions[e.defId], state:e}, document.querySelector(`[data-select="enemy-effect-${e.id}"]`)?.value); saveState(); render(); } return; }
    if (a === 'enemy-remove-effect') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ removeEffectFromEntity({state:e}, document.querySelector(`[data-select="enemy-effect-${e.id}"]`)?.value); saveState(); render(); } return; }
    if (a === 'initiative-next') { if(state.initiative.cards.length){ state.initiative.currentIndex=(state.initiative.currentIndex+1)%state.initiative.cards.length; syncActorFromInitiative(false); } saveState(); render(); return; }
    if (a === 'initiative-prev') { if(state.initiative.cards.length){ state.initiative.currentIndex=(state.initiative.currentIndex-1+state.initiative.cards.length)%state.initiative.cards.length; syncActorFromInitiative(false); } saveState(); render(); return; }
    if (a === 'initiative-shuffle') { state.initiative.cards.sort(()=>Math.random()-.5); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-end-round') { state.initiative.round+=1; state.initiative.cards.sort(()=>Math.random()-.5); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-reset-party') { state.initiative.cards = Object.values(DATA.party).map(p=>({id:uid('init'), type:'party', ref:p.id, label:p.name})); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-set-current') { const idx=state.initiative.cards.findIndex(c=>c.id===btn.dataset.id); if(idx>=0){ state.initiative.currentIndex=idx; syncActorFromInitiative(false); saveState(); render(); } return; }
    if (a === 'initiative-remove') { const idx=state.initiative.cards.findIndex(c=>c.id===btn.dataset.id); if(idx>=0){ state.initiative.cards.splice(idx,1); state.initiative.currentIndex=Math.min(state.initiative.currentIndex, Math.max(0,state.initiative.cards.length-1)); syncActorFromInitiative(false); saveState(); render(); } return; }
    if (a === 'initiative-add-card') { const val=byId('initiativeAddSelect')?.value || 'party:rook'; const [type,ref]=val.split(':'); const label = type==='party' ? DATA.party[ref].name : type==='enemy' ? DATA.enemyDefinitions[ref].name : DATA.commandDefinitions[ref].name; insertInitiativeCard({id:uid('init'), type, ref, label}); saveState(); render(); return; }
    if (a === 'summon-command') { summonCommand(btn.dataset.def); return; }
    if (a === 'load-command-actor') { state.ui.actorId = `command:${btn.dataset.id}`; state.ui.activeTab = 'play'; state.ui.actionId = null; saveState(); render(); return; }
    if (a === 'command-damage') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ const def=DATA.commandDefinitions[c.defId]; c.damage=Math.max(0, Math.min(def.hp, c.damage+Number(btn.dataset.delta))); if(c.damage>=def.hp)c.defeated=true; saveState(); render(); } return; }
    if (a === 'command-sp') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ const def=DATA.commandDefinitions[c.defId]; c.sp=Math.max(0, Math.min(def.maxSp, c.sp+Number(btn.dataset.delta))); saveState(); render(); } return; }
    if (a === 'toggle-command-dismiss') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ c.dismissed=!c.dismissed; saveState(); render(); } return; }
    if (a === 'save-rewards') { state.rewards.gold=Number(byId('rewardGold')?.value||0); state.rewards.xp=Number(byId('rewardXp')?.value||0); state.rewards.notes=byId('rewardNotes')?.value||''; saveState(); render(); return; }
    if (a === 'export-snapshot') { const box=byId('snapshotBox'); if(box) box.value=JSON.stringify(state,null,2); return; }
    if (a === 'copy-snapshot') { const text=byId('snapshotBox')?.value || JSON.stringify(state,null,2); navigator.clipboard?.writeText(text); return; }
    if (a === 'import-snapshot') { try { const imported=JSON.parse(byId('snapshotBox')?.value || '{}'); state=mergeState(imported); saveState(); render(); addLog('Imported V3 snapshot'); } catch(e) { alert('Import failed: '+e.message); } return; }
    if (a === 'reset-app') { if(confirm('Reset V3 local state on this device?')) { state=defaultState(); saveState(); render(); } return; }
    if (a === 'update-cache') { updateCache(); return; }
    if (a === 'clear-cache') { clearCache(); return; }
  });
  document.addEventListener('change', function (ev) {
    const el = ev.target;
    if (el.dataset.change === 'actor') { selectActor(el.value); }
  });

  async function updateCache() {
    const status = byId('dataStatus');
    if (!('serviceWorker' in navigator)) { if(status) status.textContent='Service workers are not available here.'; return; }
    try {
      const reg = await navigator.serviceWorker.getRegistration() || await navigator.serviceWorker.register('service-worker.js');
      await reg.update();
      if (status) status.textContent = 'Cache update requested. Reload/reopen after GitHub Pages finishes deploying.';
    } catch (err) { if(status) status.textContent = 'Cache update failed: ' + err.message; }
  }
  async function clearCache() {
    const status = byId('dataStatus');
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.includes('middara')).map(k => caches.delete(k)));
      }
      if (status) status.textContent = 'Cached app files cleared. Local game state was not cleared.';
    } catch (err) { if(status) status.textContent = 'Cache clear failed: ' + err.message; }
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  normalizeState();
  saveState();
  render();
})();
  </script>
</body>
</html>
