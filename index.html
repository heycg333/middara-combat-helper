<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Middara Helper" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <title>Middara Combat Helper - V3.0C Attack Resolver</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #182235;
      --panel2: #212f46;
      --card: rgba(15, 23, 42, .62);
      --card2: rgba(2, 6, 23, .32);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --dim: #94a3b8;
      --line: rgba(255,255,255,.14);
      --accent: #38bdf8;
      --accent2: #a3e635;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --input: #0b1220;
      --shadow: 0 18px 40px rgba(0,0,0,.32);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 0 0, #23344f, #0f172a 44%, #070b13 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.42;
      padding-bottom: 96px;
    }
    header, main { width: min(1240px, 100%); margin: 0 auto; }
    header { padding: 18px 14px 10px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 3vw, 2.55rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 10px; font-size: 1.08rem; }
    h3 { margin: 0 0 8px; font-size: .98rem; color: var(--accent); }
    p { margin: 0 0 10px; }
    .subtitle { color: var(--muted); max-width: 960px; }
    main { padding: 0 14px 34px; display: grid; gap: 14px; }
    .nav { position: sticky; top: 0; z-index: 50; padding: 8px; margin: 0 14px 8px; background: rgba(15,23,42,.94); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
    .nav button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 820px) { .nav { grid-template-columns: repeat(4, minmax(0,1fr)); border-radius: 18px; } }
    .panel { background: linear-gradient(180deg, rgba(255,255,255,.046), rgba(255,255,255,.018)), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .panel.soft { background: var(--panel2); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .card.selected { border-color: rgba(56,189,248,.72); background: rgba(56,189,248,.10); }
    .card.danger { border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.08); }
    .card.ok { border-color: rgba(52,211,153,.5); background: rgba(52,211,153,.08); }
    .flow-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; align-items: start; }
    @media (max-width: 760px) { .flow-grid { grid-template-columns: 1fr; } }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .field-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    @media (max-width: 860px) { .field-grid, .field-grid.three, .grid.two, .grid.three { grid-template-columns: 1fr; } }
    label { display: block; color: var(--muted); font-size: .86rem; margin: 0 0 5px; }
    input, select, textarea, button { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--input); color: var(--text); font: inherit; font-size: 16px; padding: 10px 11px; }
    textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; }
    button { cursor: pointer; font-weight: 800; background: #334155; }
    button:hover { filter: brightness(1.08); }
    button.primary { background: linear-gradient(180deg, #22c55e, #15803d); border-color: rgba(34,197,94,.52); }
    button.accent { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #06111f; border-color: rgba(56,189,248,.52); }
    button.warn { background: linear-gradient(180deg, #fbbf24, #d97706); color: #111827; border-color: rgba(251,191,36,.52); }
    button.danger { background: linear-gradient(180deg, #fb7185, #be123c); color: #fff; border-color: rgba(251,113,133,.55); }
    button.ghost { background: rgba(15,23,42,.55); color: var(--muted); }
    button.active, .nav button.active { background: linear-gradient(180deg, #38bdf8, #0ea5e9); color: #05131f; border-color: rgba(56,189,248,.7); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn-row button { width: auto; min-width: 112px; }
    .compact-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .compact-actions button { width: auto; min-width: 0; padding: 7px 9px; font-size: .84rem; }
    .note { color: var(--muted); font-size: .9rem; }
    .tiny { color: var(--dim); font-size: .78rem; }
    .pillbox { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); background: rgba(15,23,42,.54); border-radius: 999px; padding: 5px 8px; color: var(--muted); font-size: .8rem; }
    .pill strong { color: var(--text); }
    .hr { height: 1px; background: var(--line); margin: 12px 0; }
    .entity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 10px; }
    .entity-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .entity-head strong { overflow-wrap: anywhere; }
    .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar span { display:block; height:100%; background: var(--accent); }
    .bar.danger span { background: var(--danger); }
    .effects { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 22px; }
    .effect { border: 1px solid rgba(163,230,53,.34); color: #d9f99d; background: rgba(163,230,53,.08); border-radius: 999px; padding: 3px 7px; font-size: .74rem; }
    .token { border-color: rgba(56,189,248,.35); color: #bae6fd; background: rgba(56,189,248,.08); }
    .live-title { display:flex; justify-content:space-between; gap:10px; align-items:start; flex-wrap:wrap; }
    .status-line { min-height: 45px; display: flex; align-items: center; border: 1px solid rgba(56,189,248,.25); background: rgba(56,189,248,.07); border-radius: 14px; padding: 10px 12px; color: var(--muted); }
    .footer { position: fixed; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 70; width: min(1210px, calc(100% - 20px)); margin: 0 auto; background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.98)); border: 1px solid rgba(56,189,248,.35); border-radius: 18px; padding: 10px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; box-shadow: 0 16px 42px rgba(0,0,0,.45); }
    .footer-title { font-weight: 900; }
    .footer-detail { color: var(--muted); font-size: .84rem; }
    .footer-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .footer-actions button { width:auto; min-width:82px; padding: 8px 10px; font-size:.85rem; }
    @media (max-width: 680px) { .footer { grid-template-columns: 1fr; } .footer-actions { justify-content:flex-start; } body { padding-bottom: 154px; } }
    .initiative-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:10px; }
    .initiative-card.current { border-color: rgba(56,189,248,.75); background: rgba(56,189,248,.09); }
    .num { width:28px; height:28px; display:grid; place-items:center; border-radius:999px; background: rgba(255,255,255,.1); color:var(--muted); font-weight:900; }
    .current .num { background:var(--accent); color:#06111f; }
    details { border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:rgba(15,23,42,.48); }
    summary { cursor:pointer; color:var(--accent); font-weight:900; }
    .table-ish { display:grid; gap:8px; }

    .result-metric { font-size: 1.18rem; color: var(--text); font-weight: 800; }
    .mini-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 12px; }
    .mini-table th, .mini-table td { border-bottom: 1px solid var(--line); padding: 8px 9px; text-align: left; vertical-align: top; }
    .mini-table th { color: var(--accent2); width: 150px; background: rgba(15,23,42,.56); }
    .mini-table tr:last-child th, .mini-table tr:last-child td { border-bottom: 0; }
    button:disabled { opacity: .56; cursor: not-allowed; filter: grayscale(.15); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Middara Combat Helper</h1>
    <div class="subtitle"><strong>V3.0C Attack Resolver</strong> - clean Play-first rebuild with rebuilt attack math, stable trackers, initiative, selected-target controls, and no legacy patch panels.</div>
  </header>
  <main id="appRoot"></main>
  <footer class="footer" id="stableFooter" aria-live="polite"></footer>
  <script>
(function () {
  'use strict';
  const VERSION = 'V3.0C';
  const STORAGE_KEY = 'middara.combatHelper.v3.state';

  const DATA = {
    party: {
      rook: { id:'rook', name:'Rook', hp:26, recovery:3, maxSp:5, defense:13, armor:5, movement:7, tags:['Adventurer'], note:'High armor front line; Rook defense will return in a later V3 module.' },
      remi: { id:'remi', name:'Remi', hp:32, recovery:3, maxSp:5, defense:12, armor:1, movement:6, tags:['Adventurer'], note:'Chain Pick / Scimitar / Whirlwind helpers return after core attack is stable.' },
      nightingale: { id:'nightingale', name:'Nightingale', hp:32, recovery:3, maxSp:5, defense:13, armor:1, movement:7, tags:['Adventurer'], note:'Life Grasp and Loyal Esper tools return as a clean V3 component.' },
      zeke: { id:'zeke', name:'Zeke', hp:24, recovery:3, maxSp:5, defense:13, armor:1, movement:7, tags:['Adventurer'], note:'Onslaught / Blade Works helpers return after core attack is stable.' }
    },
    enemyDefinitions: {
      animate: { id:'animate', name:'Animate', hp:30, defense:13, armor:3, movement:6, conviction:['Teal','Green'], tags:['Intelligent'] },
      merk_hound: { id:'merk_hound', name:'Merk Hound', hp:18, defense:14, armor:0, movement:6, conviction:['Teal','Green'], tags:['Intelligent','Aquatic'] },
      fragor: { id:'fragor', name:'Fragor', hp:16, defense:13, armor:0, movement:4, conviction:['Teal','Orange'], tags:['Intelligent','Insect','Swarm'] },
      adlet_drudge: { id:'adlet_drudge', name:'Adlet Drudge', hp:18, defense:12, armor:0, movement:8, conviction:['Teal','Red'], tags:['Intelligent','Adlet','Swarm'], immunities:['Darkness','Poison','Sedate'] },
      earth_loa_itlum: { id:'earth_loa_itlum', name:'Earth Loa - Itlum Rich', hp:36, defense:12, armor:5, movement:4, conviction:['Teal','Teal'], tags:['Intelligent','Loa','Variation'], immunities:['Darkness','Sedate'] }
    },
    commandDefinitions: {
      agares: { id:'agares', name:'Agares', hp:32, recovery:3, maxSp:5, defense:13, armor:4, movement:4, soi:4, tags:['Loyal Esper','Command','Squeeze'] },
      eliphie: { id:'eliphie', name:'Eliphie', hp:32, recovery:3, maxSp:5, defense:13, armor:0, movement:6, soi:4, tags:['Loyal Esper','Command'] }
    },
    dice: {
      White:  [{value:2},{value:3},{value:4, shield:1},{value:5, book:1, shield:1},{value:6, book:1, shield:2},{value:7, book:1, shield:2, burst:1}],
      Teal:   [{value:3},{value:4},{value:5, shield:1},{value:6, book:1, shield:1},{value:7, book:1, shield:2},{value:8, book:1, shield:2, burst:1}],
      Green:  [{value:4},{value:5},{value:6, shield:1},{value:7, book:1, shield:1},{value:8, book:1, shield:2},{value:9, book:1, shield:2, burst:1}],
      Blue:   [{value:5},{value:6},{value:7, shield:1},{value:8, book:1, shield:1},{value:9, book:1, shield:2},{value:10, book:1, shield:2, burst:1}],
      Purple: [{value:1},{value:2},{value:3, book:1},{value:5, book:1, shield:1},{value:6, book:2, shield:1},{value:7, book:2, shield:1, burst:1}],
      Orange: [{value:2},{value:3},{value:4, book:1},{value:6, book:1, shield:1},{value:7, book:2, shield:1},{value:8, book:2, shield:1, burst:1}],
      Red:    [{value:3},{value:4},{value:5, book:1},{value:7, book:1, shield:1},{value:8, book:2, shield:1},{value:9, book:2, shield:1, burst:1}],
      Grey:   [{value:4},{value:5},{value:6, book:1},{value:8, book:1, shield:1},{value:9, book:2, shield:1},{value:10, book:2, shield:1, burst:1}],
      Black:  [{value:0, book:2, shield:2, label:'2 Book + 2 Shield'}, {value:0, book:3, shield:1, label:'3 Book + 1 Shield'}, {value:0, book:1, shield:3, label:'1 Book + 3 Shield'}, {value:0, shield:4, label:'4 Shield'}, {value:0, book:4, label:'4 Book'}, {value:0, skull:1, label:'Skull'}]
    },
    attackProfiles: {
      rook_default: { id:'rook_default', actor:'rook', label:'Rook - Loche Smasher + Svalinn', dice:['Green','Blue'], range:'Melee 1', ap:1, passivePhysical:0, abilities:[{name:'Loche Shield', shield:1, physical:1}, {name:'Loche Burst', burst:1, physical:3}], notes:'Default +1 Armor Piercing from Loche Smasher.' },
      remi_chain_melee: { id:'remi_chain_melee', actor:'remi', label:'Remi - Chain Pick melee side', dice:['Green','Green','Black'], range:'Melee 1', ap:0, passivePhysical:1, abilities:[{name:'2 Shield', shield:2, physical:3}, {name:'Burst', burst:1, physical:3}], notes:'Hammer Helm passive adds +1 Physical Damage. Master Work can add +1 to attack roll.' },
      remi_chain_ranged: { id:'remi_chain_ranged', actor:'remi', label:'Remi - Chain Pick ranged side', dice:['Red','Green','Black'], range:'Range 4', ap:0, passivePhysical:1, abilities:[{name:'Shield', shield:1, physical:1}, {name:'Burst', burst:1, physical:3}], notes:'Hammer Helm passive adds +1 Physical Damage. Master Work can add +1 to attack roll.' },
      remi_scimitar: { id:'remi_scimitar', actor:'remi', label:'Remi - Scimitar Swallow', dice:['Teal','Teal'], range:'Melee 1', ap:0, passivePhysical:1, abilities:[{name:'2 Shield', shield:2, physical:2}, {name:'Burst', burst:1, physical:2}], notes:'Hammer Helm passive adds +1 Physical Damage.' },
      night_default: { id:'night_default', actor:'nightingale', label:'Nightingale - Wand + Trophy', dice:['Grey','Red','Black'], range:'Range 4', ap:0, passivePhysical:0, passiveMagic:0, abilities:[{name:'Trophy Book', book:1, magic:1}, {name:'Wand 2 Book', book:2, magic:2}, {name:'Trophy Burst', burst:1, magic:4}, {name:'Wand Burst', burst:1, magic:3}], notes:'Nightstalker/Wand symbols deal Magic Damage. Trophy/Morbid follow-up helpers return in later V3 modules.' },
      zeke_default: { id:'zeke_default', actor:'zeke', label:'Zeke - dual short swords', dice:['Green','Blue'], range:'Melee 1', ap:0, passivePhysical:0, abilities:[{name:'Sword 2 Shield', shield:2, physical:3}, {name:'Dweller Shield', shield:1, physical:1}, {name:'Sword Burst', burst:1, physical:4}, {name:'Dweller Burst', burst:1, physical:3}], notes:'Adjacent targets may not Dodge from Sword of Sorrow; track board legality manually.' },
      agares_punch: { id:'agares_punch', actor:'agares', label:'Agares - Gigantic Punch', dice:['Grey','Red','Black'], range:'Melee 1', ap:0, passivePhysical:0, abilities:[{name:'Book', book:1, magic:1}, {name:'Wand 2 Book', book:2, magic:2}, {name:'Trophy Burst', burst:1, magic:4}, {name:'Wand Burst', burst:1, magic:3}], notes:'FU Push 3, Force 10 + difference hit is a reminder for now.' },
      agares_horn: { id:'agares_horn', actor:'agares', label:'Agares - Horn Energy Blast', dice:['Grey','Red','Black'], range:'Range 6', ap:0, passivePhysical:0, abilities:[{name:'Book', book:1, magic:1}, {name:'Wand 2 Book', book:2, magic:2}, {name:'Trophy Burst', burst:1, magic:4}, {name:'Wand Burst', burst:1, magic:3}], notes:'FU Pull 3, Force 10 + difference hit is a reminder for now.' },
      eliphie_scalpel: { id:'eliphie_scalpel', actor:'eliphie', label:'Eliphie - Scalpel', dice:['Grey','Red','Black'], range:'Melee 1', ap:0, passivePhysical:0, abilities:[{name:'Book', book:1, magic:1}, {name:'Burst', burst:1, magic:2}, {name:'Wand 2 Book', book:2, magic:2}, {name:'Trophy Burst', burst:1, magic:4}], notes:'Bag Full of Organs / support helpers return after core combat is stable.' }
    },
    effects: ['Darkness','Condemn','Disease','Paralyze','Poison','Wilt','Sedate','Barrier','Courage','Haste','Tether','Nemesis'],
    tokens: ['Dodge','Heal','Intervention','Vow','Summon','Energy']
  };

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function byId(id) { return document.getElementById(id); }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function uid(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
  function nowStamp() { return new Date().toLocaleString(); }

  function defaultParty() {
    const party = {};
    Object.values(DATA.party).forEach(p => {
      party[p.id] = { id:p.id, damage:0, sp:p.recovery, effects:[], tokens:{} };
    });
    return party;
  }
  function defaultState() {
    return {
      schema: 'middara-v3-clean-shell',
      version: VERSION,
      createdAt: new Date().toISOString(),
      ui: { activeTab:'play', actorId:'party:rook', targetId:null, targetScope:'enemies', actionId:null, selectedParty:'rook', appliedResultKey:null },
      attack: { profileId:'rook_default', faces:{}, empower:false, empowerFace:0, manualAttackMod:0, manualPhysical:0, manualMagic:0, manualArmorPiercing:0, targetDefenseMod:0, useMasterWork:false, useCourage: true },
      party: defaultParty(),
      enemies: [],
      command: [],
      initiative: {
        round: 1,
        currentIndex: 0,
        cards: [
          { id: uid('init'), type:'party', ref:'rook', label:'Rook' },
          { id: uid('init'), type:'party', ref:'remi', label:'Remi' },
          { id: uid('init'), type:'party', ref:'nightingale', label:'Nightingale' },
          { id: uid('init'), type:'party', ref:'zeke', label:'Zeke' }
        ]
      },
      rewards: { gold:0, xp:0, notes:'' },
      settings: { autoAddEnemyInitiative:true, autoAddCommandInitiative:true },
      log: []
    };
  }
  let state = loadState();

  function mergeState(raw) {
    const base = defaultState();
    const next = Object.assign(base, raw || {});
    next.ui = Object.assign(base.ui, raw?.ui || {});
    next.attack = Object.assign(base.attack, raw?.attack || {});
    next.attack.faces = Object.assign(base.attack.faces, raw?.attack?.faces || {});
    next.party = Object.assign(base.party, raw?.party || {});
    next.initiative = Object.assign(base.initiative, raw?.initiative || {});
    next.rewards = Object.assign(base.rewards, raw?.rewards || {});
    next.settings = Object.assign(base.settings, raw?.settings || {});
    next.enemies = Array.isArray(raw?.enemies) ? raw.enemies : [];
    next.command = Array.isArray(raw?.command) ? raw.command : [];
    next.log = Array.isArray(raw?.log) ? raw.log : [];
    next.version = VERSION;
    return next;
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return mergeState(JSON.parse(raw));
    } catch (err) {
      console.warn('Failed to load state', err);
      return defaultState();
    }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { console.warn('Failed to save state', err); }
  }
  function setState(mutator, opts={}) {
    mutator(state);
    normalizeState();
    saveState();
    render();
    if (opts.log) addLog(opts.log, opts.detail || '');
  }
  function addLog(title, detail='') {
    state.log.unshift({ id:uid('log'), time:nowStamp(), title, detail });
    state.log = state.log.slice(0, 80);
    saveState();
    render();
  }
  function normalizeState() {
    if (!state.ui) state.ui = defaultState().ui;
    if (!DATA.party[state.ui.selectedParty]) state.ui.selectedParty = 'rook';
    if (!state.initiative.cards.length) state.initiative.currentIndex = 0;
    if (state.initiative.currentIndex >= state.initiative.cards.length) state.initiative.currentIndex = Math.max(0, state.initiative.cards.length - 1);
    if (!state.ui.actorId) syncActorFromInitiative(false);
  }

  function currentInitiativeCard() { return state.initiative.cards[state.initiative.currentIndex] || null; }
  function actorLabel(actorId = state.ui.actorId) {
    if (!actorId) return 'No actor';
    const [type, id] = actorId.split(':');
    if (type === 'party') return DATA.party[id]?.name || id;
    if (type === 'enemy') return state.enemies.find(e => e.id === id)?.label || 'Enemy';
    if (type === 'command') return state.command.find(c => c.id === id)?.label || 'Command Combatant';
    return actorId;
  }
  function actorKind(actorId = state.ui.actorId) { return (actorId || '').split(':')[0] || 'none'; }
  function getActor(actorId = state.ui.actorId) {
    const [type, id] = (actorId || ':').split(':');
    if (type === 'party') return { type, id, def: DATA.party[id], state: state.party[id] };
    if (type === 'enemy') { const s = state.enemies.find(e => e.id === id); return { type, id, def: DATA.enemyDefinitions[s?.defId], state:s }; }
    if (type === 'command') { const s = state.command.find(c => c.id === id); return { type, id, def: DATA.commandDefinitions[s?.defId], state:s }; }
    return { type:'none' };
  }
  function targetLabel(targetId = state.ui.targetId) {
    if (!targetId) return 'No target selected';
    const [type, id] = targetId.split(':');
    if (type === 'party') return DATA.party[id]?.name || id;
    if (type === 'enemy') return state.enemies.find(e => e.id === id)?.label || 'Enemy';
    if (type === 'command') return state.command.find(c => c.id === id)?.label || 'Command Combatant';
    return targetId;
  }
  function actionLabel(actionId = state.ui.actionId) {
    const labels = { attack:'Attack', spell:'Spell / Force', enemyAttack:'Enemy Attack', support:'Support', summon:'Summon Esper', whirlwind:'Whirlwind', onslaught:'Onslaught', bladeWorks:'Blade Works', wait:'Manual / reminder' };
    return labels[actionId] || 'Choose action';
  }
  function currentFooterText() {
    const actor = actorLabel();
    const action = actionLabel();
    const target = targetLabel();
    if (state.ui.actionId === 'attack') {
      const result = calculateAttackResult();
      if (result.ready) {
        const applied = state.ui.appliedResultKey === result.key;
        return { title: applied ? 'Applied attack damage' : `${result.hit ? 'Hit' : 'Miss'} - ${result.finalDamage} damage`, detail: `${actor} attacking ${target}. Attack ${result.attackTotal} vs Defense ${result.targetDefense}. ${applied ? 'This exact result has already been applied.' : 'Use Apply when ready.'}` };
      }
    }
    return { title: `${actor} - ${action}`, detail: state.ui.targetId ? `Target: ${target}. V3.0C has clean attack math; spell and enemy-attack modules return next.` : 'Choose a target, then an action.' };
  }

  function actorOptionsHtml() {
    const opts = [];
    Object.values(DATA.party).forEach(p => opts.push({ value:`party:${p.id}`, label:p.name }));
    const initKeys = new Set(state.initiative.cards.map(c => `${c.type}:${c.ref}`));
    state.command
      .filter(c => !c.defeated && !c.dismissed && initKeys.has(`command:${c.defId}`))
      .forEach(c => opts.push({ value:`command:${c.id}`, label:c.label }));
    state.enemies
      .filter(e => !e.defeated && initKeys.has(`enemy:${e.defId}`))
      .forEach(e => opts.push({ value:`enemy:${e.id}`, label:e.label }));
    if (state.ui.actorId && !opts.some(o => o.value === state.ui.actorId)) {
      const label = actorLabel(state.ui.actorId);
      if (label && label !== 'No actor') opts.push({ value:state.ui.actorId, label:`${label} (manual)` });
    }
    return opts.map(o => `<option value="${escapeHtml(o.value)}" ${state.ui.actorId===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
  }
  function selectActor(actorId) {
    state.ui.actorId = actorId;
    state.ui.actionId = null;
    const actor = getActor(actorId);
    if (actor.type === 'party') state.ui.selectedParty = actor.id;
    saveState(); render();
  }
  function selectTarget(targetId) {
    state.ui.targetId = targetId;
    saveState(); render();
  }
  function syncActorFromInitiative(doRender=true) {
    const card = currentInitiativeCard();
    if (!card) return;
    let actorId = null;
    if (card.type === 'party') actorId = `party:${card.ref}`;
    if (card.type === 'command') {
      const c = state.command.find(x => x.defId === card.ref && !x.defeated && !x.dismissed);
      if (c) actorId = `command:${c.id}`;
    }
    if (card.type === 'enemy') {
      const e = state.enemies.find(x => x.defId === card.ref && !x.defeated);
      if (e) actorId = `enemy:${e.id}`;
    }
    if (actorId) state.ui.actorId = actorId;
    if (doRender) { saveState(); render(); }
  }

  function hpBar(current, max) {
    const pct = max ? Math.max(0, Math.min(100, 100 * (max-current) / max)) : 0;
    return `<div class="bar ${current >= max ? 'danger' : ''}"><span style="width:${pct}%"></span></div>`;
  }
  function renderEffects(entity, type, id) {
    const effects = (entity.effects || []).map(e => `<span class="effect">${escapeHtml(e)}</span>`).join('');
    const tokens = Object.entries(entity.tokens || {}).filter(([,n]) => n>0).map(([k,n]) => `<span class="effect token">${escapeHtml(k)} x${n}</span>`).join('');
    return `<div class="effects">${effects || '<span class="tiny">No effects</span>'}${tokens}</div>`;
  }
  function entityStatPills(def, st) {
    const hp = def.hp || 0;
    const dmg = st.damage || 0;
    const sp = st.sp != null ? `<span class="pill"><strong>SP</strong> ${st.sp}/${def.maxSp || '-'}</span>` : '';
    return `<div class="pillbox" style="margin-top:8px"><span class="pill"><strong>HP</strong> ${Math.max(0,hp-dmg)} / ${hp}</span>${sp}<span class="pill"><strong>Def</strong> ${def.defense ?? '-'}</span><span class="pill"><strong>Arm</strong> ${def.armor ?? 0}</span></div>`;
  }

  function render() {
    const root = byId('appRoot');
    root.innerHTML = renderNav() + renderActiveTab();
    renderFooter();
  }
  function renderNav() {
    const tabs = [ ['play','Play'], ['party','Party'], ['enemies','Enemies'], ['turn','Turn'], ['command','Command'], ['rewards','Rewards'], ['data','Data'] ];
    return `<section class="nav">${tabs.map(([id,label]) => `<button type="button" class="${state.ui.activeTab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</section>`;
  }
  function renderActiveTab() {
    switch (state.ui.activeTab) {
      case 'party': return renderPartyTab();
      case 'enemies': return renderEnemiesTab();
      case 'turn': return renderTurnTab();
      case 'command': return renderCommandTab();
      case 'rewards': return renderRewardsTab();
      case 'data': return renderDataTab();
      default: return renderPlayTab();
    }
  }
  function renderFooter() {
    const f = currentFooterText();
    let applyButton = '';
    if (state.ui.actionId === 'attack') {
      const result = calculateAttackResult();
      if (result.ready) {
        const applied = state.ui.appliedResultKey === result.key;
        applyButton = `<button type="button" class="primary" data-action="apply-attack" ${applied ? 'disabled' : ''}>${applied ? 'Applied ✓' : `Apply ${result.finalDamage} dmg`}</button>`;
      }
    }
    byId('stableFooter').innerHTML = `<div><div class="footer-title">${escapeHtml(f.title)}</div><div class="footer-detail">${escapeHtml(f.detail)}</div></div><div class="footer-actions">${applyButton}<button type="button" data-action="log-current">Log</button><button type="button" data-action="tab" data-tab="play">Play</button><button type="button" class="ghost" data-action="sync-actor">Sync</button></div>`;
  }

  function renderPlayTab() {
    return `<section class="panel" id="playPanel">
      <div class="live-title"><div><h2>V3.0C stable Play flow</h2><div class="note">Actor → Target → Action → Roll / Resolve → Apply. Attack math is rebuilt cleanly here; Party management stays on the Party tab.</div></div><span class="pill"><strong>Current</strong> ${escapeHtml(currentInitiativeCard()?.label || 'No initiative')}</span></div>
      <div class="flow-grid" style="margin-top:12px">
        <div class="card"><h3>1. Actor</h3>${renderActorCard()}</div>
        <div class="card"><h3>2. Target drawer</h3>${renderTargetDrawer()}</div>
        <div class="card"><h3>3. Action</h3>${renderActionCard()}</div>

  }
  function renderActorCard() {
    const actor = getActor();

      <div class="btn-row" style="margin-top:10px"><button type="button" data-action="sync-actor">Sync from initiative</button><button type="button" data-action="tab" data-tab="turn">Open initiative</button></div>
      <div class="hr"></div><div class="note">${escapeHtml(def.note || 'Select an actor from the table state.')}</div>

    return `<div class="table-ish">${active.map(c => {
      const def = DATA.commandDefinitions[c.defId], sel = state.ui.targetId === `command:${c.id}`;
      return `<div class="card ${sel?'selected':''}"><div class="entity-head"><strong>${escapeHtml(c.label)}</strong><span class="pill">HP ${Math.max(0,def.hp-c.damage)}/${def.hp}</span></div>${hpBar(c.damage, def.hp)}${entityStatPills(def, c)}${renderEffects(c,'command',c.id)}<div class="compact-actions"><button type="button" class="accent" data-action="select-target" data-target="command:${c.id}">Target</button><button type="button" data-action="load-command-actor" data-id="${c.id}">Load actor</button></div></div>`;

  function renderSelectedTargetTools() {
    const ent = getEntityByTarget(state.ui.targetId);

    const spTools = canSp ? `<button data-action="target-sp" data-delta="1">+1 SP</button><button data-action="target-sp" data-delta="-1">-1 SP</button>` : '';
    return `<div class="card target-tools">
      <div class="entity-head"><strong>${escapeHtml(title)}</strong><span class="pill">${escapeHtml(ent.type)}</span></div>
      ${hpBar(ent.state.damage || 0, ent.def.hp || 0)}${entityStatPills(ent.def, ent.state)}${renderEffects(ent.state, ent.type, ent.id)}
      <div class="compact-actions"><button data-action="target-damage" data-delta="1">+1 dmg</button><button data-action="target-damage" data-delta="-1">-1 dmg</button><button data-action="target-damage" data-delta="5">+5 dmg</button><button data-action="target-damage" data-delta="-5">-5 dmg</button>${spTools}</div>
      <div class="field-grid" style="margin-top:8px"><div><label>Effect</label><select id="targetEffectSelect">${DATA.effects.map(e=>`<option>${escapeHtml(e)}</option>`).join('')}</select></div><div><label>&nbsp;</label><div class="compact-actions"><button data-action="target-add-effect">Add effect</button><button data-action="target-remove-effect">Remove effect</button></div></div></div>
      ${tokenTools}
      <div class="compact-actions">${ent.type === 'enemy' ? `<button data-action="select-actor" data-actor="${safeTargetId}">Use as enemy actor</button>` : ent.type === 'party' ? `<button data-action="select-actor" data-actor="${safeTargetId}">Use as actor</button>` : `<button data-action="load-command-actor" data-id="${escapeHtml(ent.id)}">Load actor</button>`}</div>
    </div>`;

  function renderActionCard() {
    const actor = getActor();
    const buttons = [];
    if (actor.type === 'enemy') {
      buttons.push(['enemyAttack','Enemy Attack','Resolve an enemy attack against party/Command.']);
      buttons.push(['wait','AI / reminder','Use the physical AI card; app AI is intentionally omitted in V3 shell.']);
    } else if (actor.type === 'party') {
      buttons.push(['attack','Attack','Roll combat dice, resolve symbols, and apply damage.']);
      buttons.push(['spell','Spell / Force','Spell resolver returns in V3.0D.']);
      buttons.push(['support','Support','Use Party/Command trackers for now.']);
      if (actor.id === 'nightingale') buttons.push(['summon','Summon Esper','Open the clean Command summon controls.']);
      if (actor.id === 'remi') buttons.push(['whirlwind','Whirlwind','Reminder only in V3.0C.']);
      if (actor.id === 'zeke') buttons.push(['onslaught','Onslaught','Reminder only in V3.0C.']);
      if (actor.id === 'zeke') buttons.push(['bladeWorks','Blade Works','Reminder only in V3.0C.']);
    } else if (actor.type === 'command') {
      buttons.push(['attack','Attack','Roll Esper attack dice and apply damage.']);
      buttons.push(['spell','Spell / support','Esper spell/support returns after Command core.']);
    }
    return `<div class="grid two">${buttons.map(([id,label,note]) => `<button type="button" class="${state.ui.actionId===id?'active':''}" data-action="set-action" data-action-id="${id}"><strong>${label}</strong><br><span class="tiny">${note}</span></button>`).join('')}</div>`;
  }
  function renderResolveCard() {
    if (state.ui.actionId === 'attack') return renderAttackResolver();
    const actor = actorLabel(), target = targetLabel(), action = actionLabel();
    let special = '';
    if (state.ui.actionId === 'summon') special = renderSummonMini();
    const note = state.ui.actionId === 'spell' ? 'Spell math returns in V3.0D.' : state.ui.actionId === 'enemyAttack' ? 'Enemy attack / defense trays return in V3.0E.' : 'Use the tracker buttons below for now; rules-heavy automation returns only where it helps live play.';
    return `<div class="status-line"><div><strong>${escapeHtml(actor)}</strong> - ${escapeHtml(action)}<br><span class="tiny">${escapeHtml(target)}. ${note}</span></div></div>
      ${special}
      <div class="compact-actions"><button type="button" class="primary" data-action="log-current">Log planned action</button><button type="button" data-action="tab" data-tab="enemies">Enemy tracker</button><button type="button" data-action="tab" data-tab="party">Party tracker</button></div>`;
  }

  function renderAttackResolver() {
    const target = getEntityByTarget(state.ui.targetId);
    const profiles = getAttackProfilesForActor(state.ui.actorId);
    if (!profiles.length) return `<div class="status-line"><div><strong>No attack profile</strong><br><span class="tiny">${escapeHtml(actorLabel())} does not have a V3 attack profile yet.</span></div></div>`;
    ensureAttackProfileValid(false);
    const profile = DATA.attackProfiles[state.attack.profileId] || profiles[0];
    const result = calculateAttackResult();
    return `<div class="status-line"><div><strong>${escapeHtml(actorLabel())}</strong> attacking <strong>${escapeHtml(targetLabel())}</strong><br><span class="tiny">${target ? 'Enter dice below. Results auto-update; Apply writes damage to the selected target.' : 'Select a target first.'}</span></div></div>
      <div class="hr"></div>
      <label>Attack profile</label>
      <select id="attackProfileSelect" data-change="attack-profile">${profiles.map(p => `<option value="${p.id}" ${state.attack.profileId===p.id?'selected':''}>${escapeHtml(p.label)} (${escapeHtml(p.range || '')})</option>`).join('')}</select>
      <div class="tiny" style="margin-top:6px">${escapeHtml(profile.notes || '')}</div>
      <div class="field-grid" style="margin-top:10px">${renderAttackDiceInputs(profile)}</div>
      ${renderAttackOptions(profile)}
      <div class="hr"></div>
      ${renderAttackResult(result)}`;
  }

  function getAttackProfilesForActor(actorId = state.ui.actorId) {
    const actor = getActor(actorId);
    if (actor.type === 'party') return Object.values(DATA.attackProfiles).filter(p => p.actor === actor.id);
    if (actor.type === 'command') return Object.values(DATA.attackProfiles).filter(p => p.actor === actor.def?.id);
    return [];
  }
  function ensureAttackProfileValid(doRender=true) {
    const profiles = getAttackProfilesForActor();
    if (!profiles.length) return;
    if (!profiles.some(p => p.id === state.attack.profileId)) {
      state.attack.profileId = profiles[0].id;
      state.attack.faces = {};
      state.attack.empower = false;
      state.ui.appliedResultKey = null;
      if (doRender) { saveState(); render(); }
    }
  }
  function faceLabel(face, idx) {
    if (!face) return `Face ${idx+1}`;
    if (face.skull) return face.label || 'Skull';
    const bits = [`${face.value}`];
    if (face.book) bits.push(`${face.book} Book`);
    if (face.shield) bits.push(`${face.shield} Shield`);
    if (face.burst) bits.push(`${face.burst} Burst`);
    return face.label || bits.join(' + ');
  }
  function renderFaceOptions(color, selectedIdx) {
    const faces = DATA.dice[color] || [];
    return faces.map((f,i)=>`<option value="${i}" ${Number(selectedIdx)===i?'selected':''}>${escapeHtml(faceLabel(f,i))}</option>`).join('');
  }
  function renderAttackDiceInputs(profile) {
    const dice = profile.dice || [];
    return dice.map((color, idx) => {
      const key = `d${idx}`;
      const selected = state.attack.faces[key] != null ? Number(state.attack.faces[key]) : 0;
      return `<div><label>${escapeHtml(color)} die ${idx+1}</label><select data-change="attack-face" data-die-key="${key}">${renderFaceOptions(color, selected)}</select></div>`;
    }).join('') + (profile.dice?.includes('Black') ? '' : `<div><label>&nbsp;</label><label><input type="checkbox" data-change="attack-empower" ${state.attack.empower?'checked':''}> <span class="note">Empower attack: add black die</span></label></div>${state.attack.empower ? `<div><label>Empower black die</label><select data-change="attack-empower-face">${renderFaceOptions('Black', state.attack.empowerFace || 0)}</select></div>` : ''}`);
  }
  function renderAttackOptions(profile) {
    const actor = getActor();
    const target = getEntityByTarget(state.ui.targetId);
    const hasCourage = actor.state?.effects?.includes('Courage');
    const hasDarkness = actor.state?.effects?.includes('Darkness');
    const remiMaster = actor.type === 'party' && actor.id === 'remi' && profile.id.includes('chain');
    return `<details style="margin-top:10px" open><summary>Attack options and manual modifiers</summary>
      <div class="field-grid" style="margin-top:10px">
        ${hasCourage ? `<label><input type="checkbox" data-change="attack-courage" ${state.attack.useCourage!==false?'checked':''}> <span>Courage: +1 Book and +1 Shield</span></label>` : `<div class="note">No Courage effect on actor.</div>`}
        ${hasDarkness ? `<div class="note warn-text">Darkness: -1 to attack roll is applied.</div>` : `<div class="note">No Darkness attack penalty.</div>`}
        ${remiMaster ? `<label><input type="checkbox" data-change="attack-masterwork" ${state.attack.useMasterWork?'checked':''}> <span>Use Master Work: +1 attack roll</span></label>` : `<div class="note">Profile-specific exhaust modifiers can be added later.</div>`}
        <div><label>Target Defense modifier</label><input type="number" data-change="attack-number" data-field="targetDefenseMod" value="${Number(state.attack.targetDefenseMod||0)}" /></div>
        <div><label>Manual attack roll modifier</label><input type="number" data-change="attack-number" data-field="manualAttackMod" value="${Number(state.attack.manualAttackMod||0)}" /></div>
        <div><label>Manual Armor Piercing</label><input type="number" data-change="attack-number" data-field="manualArmorPiercing" min="0" value="${Number(state.attack.manualArmorPiercing||0)}" /></div>
        <div><label>Manual Physical Damage</label><input type="number" data-change="attack-number" data-field="manualPhysical" value="${Number(state.attack.manualPhysical||0)}" /></div>
        <div><label>Manual Magic Damage</label><input type="number" data-change="attack-number" data-field="manualMagic" value="${Number(state.attack.manualMagic||0)}" /></div>
      </div>
      <div class="tiny" style="margin-top:8px">Target armor is ${target?.def?.armor ?? '-'} before Armor Piercing. Board-state options like flanking, range, line of sight, and legal target choice stay manual.</div>
    </details>`;
  }
  function symbolText(pool) {
    return `${pool.book||0} Book, ${pool.shield||0} Shield, ${pool.burst||0} Burst${pool.skull ? ', Skull' : ''}`;
  }
  function canPay(pool, ability) {
    return (pool.book||0) >= (ability.book||0) && (pool.shield||0) >= (ability.shield||0) && (pool.burst||0) >= (ability.burst||0);
  }
  function pay(pool, ability) {
    return { book:(pool.book||0)-(ability.book||0), shield:(pool.shield||0)-(ability.shield||0), burst:(pool.burst||0)-(ability.burst||0), skull:pool.skull||0 };
  }
  function optimizeSymbolSpend(profile, pool, diffHit, targetArmor, armorPiercing, manualPhysical, manualMagic) {
    const abilities = profile.abilities || [];
    let best = null;
    function score(chosen) {
      const physicalSymbols = chosen.reduce((s,a)=>s+(a.physical||0),0);
      const magicSymbols = chosen.reduce((s,a)=>s+(a.magic||0),0);
      const physical = Math.max(0, diffHit + (profile.passivePhysical||0) + physicalSymbols + manualPhysical - Math.max(0, targetArmor - armorPiercing));
      const magic = (profile.passiveMagic||0) + magicSymbols + manualMagic;
      return { finalDamage: Math.max(0, physical + magic), physical, magic, physicalSymbols, magicSymbols };
    }
    function walk(idx, remaining, chosen) {
      if (idx >= abilities.length) {
        const sc = score(chosen);
        if (!best || sc.finalDamage > best.finalDamage) best = Object.assign({ chosen: chosen.slice(), remaining }, sc);
        return;

      walk(idx+1, remaining, chosen);
      const ability = abilities[idx];
      if (canPay(remaining, ability)) walk(idx+1, pay(remaining, ability), chosen.concat(ability));

  function calculateAttackResult() {

    if (!actor.def || !profile || !target?.def || !target?.state) return { ready:false, reason:'Choose an attack actor and target.' };
    const dice = profile.dice || [];
    let attackRoll = 0;
    const pool = {book:0, shield:0, burst:0, skull:0};
    const diceRows = [];
    dice.forEach((color, idx) => {
      const face = DATA.dice[color]?.[Number(state.attack.faces[`d${idx}`] || 0)] || DATA.dice[color]?.[0] || {value:0};
      attackRoll += face.value || 0;
      pool.book += face.book || 0; pool.shield += face.shield || 0; pool.burst += face.burst || 0; pool.skull += face.skull || 0;
      diceRows.push({ color, label: faceLabel(face, idx), value: face.value || 0, symbols: {book:face.book||0, shield:face.shield||0, burst:face.burst||0, skull:face.skull||0} });
    });
    if (state.attack.empower && !dice.includes('Black')) {
      const face = DATA.dice.Black?.[Number(state.attack.empowerFace || 0)] || DATA.dice.Black[0];
      pool.book += face.book || 0; pool.shield += face.shield || 0; pool.burst += face.burst || 0; pool.skull += face.skull || 0;
      diceRows.push({ color:'Black (Empower)', label: faceLabel(face, 0), value: 0, symbols:{book:face.book||0, shield:face.shield||0, burst:face.burst||0, skull:face.skull||0} });
    }
    if (actor.state?.effects?.includes('Courage') && state.attack.useCourage !== false) { pool.book += 1; pool.shield += 1; }
    const darknessPenalty = actor.state?.effects?.includes('Darkness') ? -1 : 0;
    const masterWork = state.attack.useMasterWork ? 1 : 0;
    const manualAttack = Number(state.attack.manualAttackMod || 0);
    const attackTotal = attackRoll + manualAttack + darknessPenalty + masterWork;
    const targetDefense = (target.def.defense || 0) + Number(state.attack.targetDefenseMod || 0);
    const hit = attackTotal >= targetDefense;
    const diffHit = hit ? Math.max(0, attackTotal - targetDefense) : 0;

    const manualPhysical = Number(state.attack.manualPhysical || 0);
    const manualMagic = Number(state.attack.manualMagic || 0);

    const finalDamage = hit ? spend.finalDamage : 0;

    if (a === 'select-target') { selectTarget(btn.dataset.target); return; }
    if (a === 'select-actor') { selectActor(btn.dataset.actor); return; }
    if (a === 'target-attack') { state.ui.targetId = btn.dataset.target; state.ui.actionId = 'attack'; state.ui.appliedResultKey = null; ensureAttackProfileValid(false); saveState(); render(); return; }
    if (a === 'target-damage') { mutateTargetDamage(btn.dataset.delta); saveState(); render(); return; }
    if (a === 'target-sp') { mutateTargetSp(btn.dataset.delta); saveState(); render(); return; }
    if (a === 'target-add-effect') { const ent=getEntityByTarget(state.ui.targetId); addEffectToEntity(ent, selectedTargetEffect()); saveState(); render(); return; }
    if (a === 'target-remove-effect') { const ent=getEntityByTarget(state.ui.targetId); removeEffectFromEntity(ent, selectedTargetEffect()); saveState(); render(); return; }
    if (a === 'target-add-token') { const ent=getEntityByTarget(state.ui.targetId); addTokenToEntity(ent, selectedTargetToken()); saveState(); render(); return; }
    if (a === 'target-remove-token') { const ent=getEntityByTarget(state.ui.targetId); removeTokenFromEntity(ent, selectedTargetToken()); saveState(); render(); return; }
    if (a === 'apply-attack') { const r=calculateAttackResult(); if(!r.ready) return; if(state.ui.appliedResultKey===r.key) return; const ent = r.target; ent.state.damage = Math.max(0, Math.min(ent.def.hp || 999, (ent.state.damage||0) + r.finalDamage)); if((ent.type==='enemy' || ent.type==='command') && ent.state.damage >= ent.def.hp) ent.state.defeated = true; state.ui.appliedResultKey = r.key; saveState(); render(); addLog(`${actorLabel()} attacked ${targetLabel()}`, `${r.hit?'Hit':'Miss'}; attack ${r.attackTotal} vs defense ${r.targetDefense}; applied ${r.finalDamage} damage.`); return; }
    if (a === 'reset-attack-roll') { state.attack.faces = {}; state.attack.empower = false; state.attack.empowerFace = 0; state.attack.manualAttackMod = 0; state.attack.manualPhysical = 0; state.attack.manualMagic = 0; state.attack.manualArmorPiercing = 0; state.attack.targetDefenseMod = 0; state.attack.useMasterWork = false; state.attack.useCourage = true; state.ui.appliedResultKey = null; saveState(); render(); return; }
    if (a === 'set-action') { state.ui.actionId = btn.dataset.actionId; state.ui.appliedResultKey = null; if (state.ui.actionId === 'attack') ensureAttackProfileValid(false); saveState(); render(); return; }
    if (a === 'log-current') { if(state.ui.actionId==='attack'){ const r=calculateAttackResult(); addLog(`${actorLabel()} attack`, r.ready ? `${r.hit?'Hit':'Miss'}; attack ${r.attackTotal} vs defense ${r.targetDefense}; final damage ${r.finalDamage} to ${targetLabel()}.` : 'Attack not ready.'); } else { addLog(`${actorLabel()} - ${actionLabel()}`, `Target: ${targetLabel()}.`); } return; }
    if (a === 'add-enemy-quick') { const defId = byId('quickEnemyDef')?.value || 'animate'; const count = Math.max(1, Number(byId('quickEnemyCount')?.value || 1)); state.settings.autoAddEnemyInitiative = !!byId('quickEnemyInitiative')?.checked; addEnemies(defId, count); return; }
    if (a === 'party-damage') { const st=state.party[btn.dataset.id]; st.damage=Math.max(0, st.damage + Number(btn.dataset.delta)); saveState(); render(); return; }
    if (a === 'party-sp') { const st=state.party[btn.dataset.id]; const def=DATA.party[btn.dataset.id]; st.sp=Math.max(0, Math.min(def.maxSp, st.sp + Number(btn.dataset.delta))); saveState(); render(); return; }
    if (a === 'party-add-effect') { const id=btn.dataset.id; addEffectToEntity({type:'party', id, def:DATA.party[id], state:state.party[id]}, document.querySelector(`[data-select="party-effect-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-remove-effect') { const id=btn.dataset.id; removeEffectFromEntity({state:state.party[id]}, document.querySelector(`[data-select="party-effect-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-add-token') { const id=btn.dataset.id; addTokenToEntity({state:state.party[id]}, document.querySelector(`[data-select="party-token-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'party-remove-token') { const id=btn.dataset.id; removeTokenFromEntity({state:state.party[id]}, document.querySelector(`[data-select="party-token-${id}"]`)?.value); saveState(); render(); return; }
    if (a === 'prepare-party') { Object.keys(state.party).forEach(id => { const def=DATA.party[id], st=state.party[id]; const half=Math.floor(def.hp/2); if (st.damage > half) st.damage = half; st.sp = def.recovery; st.effects = []; }); saveState(); render(); addLog('Prepared party', 'Removed Effects, set SP to recovery, and preserved Ability Tokens.'); return; }
    if (a === 'restore-party') { Object.keys(state.party).forEach(id => { const def=DATA.party[id], st=state.party[id]; st.damage=0; st.sp=def.recovery; st.effects=[]; st.tokens={}; }); state.command=[]; saveState(); render(); addLog('Restored party', 'Removed damage, Effects, Ability Tokens, and cleared Command Combatants.'); return; }
    if (a === 'enemy-damage') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ const def=DATA.enemyDefinitions[e.defId]; e.damage=Math.max(0, Math.min(def.hp, e.damage + Number(btn.dataset.delta))); if(e.damage>=def.hp) e.defeated=true; saveState(); render(); } return; }
    if (a === 'toggle-enemy-defeated') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ e.defeated=!e.defeated; saveState(); render(); } return; }
    if (a === 'enemy-add-effect') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ addEffectToEntity({type:'enemy', id:e.id, def:DATA.enemyDefinitions[e.defId], state:e}, document.querySelector(`[data-select="enemy-effect-${e.id}"]`)?.value); saveState(); render(); } return; }
    if (a === 'enemy-remove-effect') { const e=state.enemies.find(x=>x.id===btn.dataset.id); if(e){ removeEffectFromEntity({state:e}, document.querySelector(`[data-select="enemy-effect-${e.id}"]`)?.value); saveState(); render(); } return; }
    if (a === 'clear-defeated-enemies') { state.enemies = state.enemies.filter(e => !e.defeated); saveState(); render(); addLog('Cleared defeated enemies'); return; }
    if (a === 'clear-enemies') { if(confirm('Clear all tracked enemies for this encounter?')) { state.enemies = []; state.ui.targetId = null; saveState(); render(); addLog('Cleared all enemies'); } return; }
    if (a === 'initiative-next') { if(state.initiative.cards.length){ state.initiative.currentIndex=(state.initiative.currentIndex+1)%state.initiative.cards.length; syncActorFromInitiative(false); } saveState(); render(); return; }
    if (a === 'initiative-prev') { if(state.initiative.cards.length){ state.initiative.currentIndex=(state.initiative.currentIndex-1+state.initiative.cards.length)%state.initiative.cards.length; syncActorFromInitiative(false); } saveState(); render(); return; }
    if (a === 'initiative-shuffle') { state.initiative.cards.sort(()=>Math.random()-.5); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-end-round') { state.initiative.round+=1; state.initiative.cards.sort(()=>Math.random()-.5); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-reset-party') { state.initiative.cards = Object.values(DATA.party).map(p=>({id:uid('init'), type:'party', ref:p.id, label:p.name})); state.initiative.currentIndex=0; syncActorFromInitiative(false); saveState(); render(); return; }
    if (a === 'initiative-set-current') { const idx=state.initiative.cards.findIndex(c=>c.id===btn.dataset.id); if(idx>=0){ state.initiative.currentIndex=idx; syncActorFromInitiative(false); saveState(); render(); } return; }
    if (a === 'initiative-remove') { const idx=state.initiative.cards.findIndex(c=>c.id===btn.dataset.id); if(idx>=0){ state.initiative.cards.splice(idx,1); state.initiative.currentIndex=Math.min(state.initiative.currentIndex, Math.max(0,state.initiative.cards.length-1)); syncActorFromInitiative(false); saveState(); render(); } return; }
    if (a === 'initiative-add-card') { const val=byId('initiativeAddSelect')?.value || 'party:rook'; const [type,ref]=val.split(':'); const label = type==='party' ? DATA.party[ref].name : type==='enemy' ? DATA.enemyDefinitions[ref].name : DATA.commandDefinitions[ref].name; insertInitiativeCard({id:uid('init'), type, ref, label}); saveState(); render(); return; }
    if (a === 'summon-command') { summonCommand(btn.dataset.def); return; }
    if (a === 'load-command-actor') { state.ui.actorId = `command:${btn.dataset.id}`; state.ui.activeTab = 'play'; state.ui.actionId = null; saveState(); render(); return; }
    if (a === 'command-damage') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ const def=DATA.commandDefinitions[c.defId]; c.damage=Math.max(0, Math.min(def.hp, c.damage+Number(btn.dataset.delta))); if(c.damage>=def.hp)c.defeated=true; saveState(); render(); } return; }
    if (a === 'command-sp') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ const def=DATA.commandDefinitions[c.defId]; c.sp=Math.max(0, Math.min(def.maxSp, c.sp+Number(btn.dataset.delta))); saveState(); render(); } return; }
    if (a === 'command-add-effect') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ addEffectToEntity({type:'command', id:c.id, def:DATA.commandDefinitions[c.defId], state:c}, document.querySelector(`[data-select=\"command-effect-${c.id}\"]`)?.value); saveState(); render(); } return; }
    if (a === 'command-remove-effect') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ removeEffectFromEntity({state:c}, document.querySelector(`[data-select=\"command-effect-${c.id}\"]`)?.value); saveState(); render(); } return; }
    if (a === 'command-add-token') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ addTokenToEntity({state:c}, document.querySelector(`[data-select=\"command-token-${c.id}\"]`)?.value); saveState(); render(); } return; }
    if (a === 'command-remove-token') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ removeTokenFromEntity({state:c}, document.querySelector(`[data-select=\"command-token-${c.id}\"]`)?.value); saveState(); render(); } return; }
    if (a === 'toggle-command-dismiss') { const c=state.command.find(x=>x.id===btn.dataset.id); if(c){ c.dismissed=!c.dismissed; saveState(); render(); } return; }
    if (a === 'save-rewards') { state.rewards.gold=Number(byId('rewardGold')?.value||0); state.rewards.xp=Number(byId('rewardXp')?.value||0); state.rewards.notes=byId('rewardNotes')?.value||''; saveState(); render(); return; }
    if (a === 'export-snapshot') { const box=byId('snapshotBox'); if(box) box.value=JSON.stringify(state,null,2); return; }
    if (a === 'copy-snapshot') { const text=byId('snapshotBox')?.value || JSON.stringify(state,null,2); navigator.clipboard?.writeText(text); return; }
    if (a === 'import-snapshot') { try { const imported=JSON.parse(byId('snapshotBox')?.value || '{}'); state=mergeState(imported); saveState(); render(); addLog('Imported V3 snapshot'); } catch(e) { alert('Import failed: '+e.message); } return; }
    if (a === 'reset-app') { if(confirm('Reset V3 local state on this device?')) { state=defaultState(); saveState(); render(); } return; }
    if (a === 'update-cache') { updateCache(); return; }
    if (a === 'clear-cache') { clearCache(); return; }
  });
  document.addEventListener('change', function (ev) {
    const el = ev.target;
    const ch = el.dataset.change;
    if (ch === 'actor') { selectActor(el.value); }
    if (ch === 'attack-profile') { state.attack.profileId = el.value; state.attack.faces = {}; state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-face') { state.attack.faces[el.dataset.dieKey] = Number(el.value); state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-empower') { state.attack.empower = !!el.checked; state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-empower-face') { state.attack.empowerFace = Number(el.value); state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-number') { state.attack[el.dataset.field] = Number(el.value || 0); state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-courage') { state.attack.useCourage = !!el.checked; state.ui.appliedResultKey = null; saveState(); render(); }
    if (ch === 'attack-masterwork') { state.attack.useMasterWork = !!el.checked; state.ui.appliedResultKey = null; saveState(); render(); }
  });

  async function updateCache() {
    const status = byId('dataStatus');
    if (!('serviceWorker' in navigator)) { if(status) status.textContent='Service workers are not available here.'; return; }
    try {
      const reg = await navigator.serviceWorker.getRegistration() || await navigator.serviceWorker.register('service-worker.js');
      await reg.update();
      if (status) status.textContent = 'Cache update requested. Reload/reopen after GitHub Pages finishes deploying.';
    } catch (err) { if(status) status.textContent = 'Cache update failed: ' + err.message; }
  }
  async function clearCache() {
    const status = byId('dataStatus');
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.includes('middara')).map(k => caches.delete(k)));
      }
      if (status) status.textContent = 'Cached app files cleared. Local game state was not cleared.';
    } catch (err) { if(status) status.textContent = 'Cache clear failed: ' + err.message; }
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  normalizeState();
  saveState();
  render();
})();
  </script>
</body>
</html>
