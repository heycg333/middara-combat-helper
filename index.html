<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Middara Helper" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <title>Middara Combat Helper - V3.0O State Health</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #182235;
      --panel2: #212f46;
      --card: rgba(15, 23, 42, .62);
      --card2: rgba(2, 6, 23, .32);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --dim: #94a3b8;
      --line: rgba(255,255,255,.14);
      --accent: #38bdf8;
      --accent2: #a3e635;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --input: #0b1220;
      --shadow: 0 18px 40px rgba(0,0,0,.32);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 0 0, #23344f, #0f172a 44%, #070b13 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.42;
      padding-bottom: 96px;
    }
    header, main { width: min(1240px, 100%); margin: 0 auto; }
    header { padding: 18px 14px 10px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 3vw, 2.55rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 10px; font-size: 1.08rem; }
    h3 { margin: 0 0 8px; font-size: .98rem; color: var(--accent); }
    p { margin: 0 0 10px; }
    .subtitle { color: var(--muted); max-width: 960px; }
    main { padding: 0 14px 34px; display: grid; gap: 14px; }
    .nav { position: sticky; top: 0; z-index: 50; padding: 8px; margin: 0 14px 8px; background: rgba(15,23,42,.94); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
    .nav button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 820px) { .nav { grid-template-columns: repeat(4, minmax(0,1fr)); border-radius: 18px; } }
    .panel { background: linear-gradient(180deg, rgba(255,255,255,.046), rgba(255,255,255,.018)), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .panel.soft { background: var(--panel2); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .card.selected { border-color: rgba(56,189,248,.72); background: rgba(56,189,248,.10); }
    .card.danger { border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.08); }
    .card.ok { border-color: rgba(52,211,153,.5); background: rgba(52,211,153,.08); }
    .flow-grid { display: grid; grid-template-columns: minmax(260px,.86fr) minmax(0,1.14fr); gap: 12px; align-items: start; }
    .flow-grid.resolver-active { grid-template-columns: minmax(260px,.72fr) minmax(0,1.28fr); }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .field-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    @media (max-width: 860px) { .field-grid, .field-grid.three, .grid.two, .grid.three { grid-template-columns: 1fr; } }
    label { display: block; color: var(--muted); font-size: .86rem; margin: 0 0 5px; }
    input, select, textarea, button { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--input); color: var(--text); font: inherit; font-size: 16px; padding: 10px 11px; }
    textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; }
    button { cursor: pointer; font-weight: 800; background: #334155; }
    button:hover, .button-link:hover { filter: brightness(1.08); }
    button.primary, .button-link.primary { background: linear-gradient(180deg, #22c55e, #15803d); border-color: rgba(34,197,94,.52); }
    button.accent, .button-link.accent { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #06111f; border-color: rgba(56,189,248,.52); }
    button.warn, .button-link.warn { background: linear-gradient(180deg, #fbbf24, #d97706); color: #111827; border-color: rgba(251,191,36,.52); }
    button.danger, .button-link.danger { background: linear-gradient(180deg, #fb7185, #be123c); color: #fff; border-color: rgba(251,113,133,.55); }
    button.ghost, .button-link.ghost { background: rgba(15,23,42,.55); color: var(--muted); }
    button.active, .nav button.active { background: linear-gradient(180deg, #38bdf8, #0ea5e9); color: #05131f; border-color: rgba(56,189,248,.7); }
    .button-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #334155; color: var(--text); font: inherit; font-size: 16px; font-weight: 800; padding: 10px 11px; text-decoration: none; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn-row button, .btn-row .button-link { width: auto; min-width: 112px; }
    .compact-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .compact-actions button { width: auto; min-width: 0; padding: 7px 9px; font-size: .84rem; }
    .note { color: var(--muted); font-size: .9rem; }
    .tiny { color: var(--dim); font-size: .78rem; }
    .pillbox { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); background: rgba(15,23,42,.54); border-radius: 999px; padding: 5px 8px; color: var(--muted); font-size: .8rem; }
    .pill strong { color: var(--text); }
    .hr { height: 1px; background: var(--line); margin: 12px 0; }
    .entity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 10px; }
    .entity-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .entity-head strong { overflow-wrap: anywhere; }
    .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar span { display:block; height:100%; background: var(--accent); }
    .bar.danger span { background: var(--danger); }
    .effects { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 22px; }
    .effect { border: 1px solid rgba(163,230,53,.34); color: #d9f99d; background: rgba(163,230,53,.08); border-radius: 999px; padding: 3px 7px; font-size: .74rem; }
    .token { border-color: rgba(56,189,248,.35); color: #bae6fd; background: rgba(56,189,248,.08); }
    .live-title { display:flex; justify-content:space-between; gap:10px; align-items:start; flex-wrap:wrap; }
    .play-flow-panel { padding: 12px; }
    .play-card { min-width: 0; padding: 10px; }
    .play-card h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--accent2); font-size: .9rem; text-transform: uppercase; letter-spacing: .04em; }
    .play-card .btn-row button { min-width: 96px; }
    .battle-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
    .battle-stat { border: 1px solid rgba(56,189,248,.22); background: rgba(15,23,42,.44); border-radius: 12px; padding: 8px 9px; min-height: 58px; }
    .battle-stat span { display: block; color: var(--dim); font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
    .battle-stat strong { display: block; margin-top: 2px; color: var(--text); overflow-wrap: anywhere; line-height: 1.22; }
    .play-support-grid { display: grid; grid-template-columns: minmax(300px,.82fr) minmax(0,1.18fr); gap: 12px; align-items: start; }
    .play-side-panel, .log-panel { padding: 12px; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .panel-heading h2 { margin: 0; }
    .quick-enemy-grid { align-items: end; }
    .quick-status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .target-tools { display: grid; gap: 10px; }
    .target-adjust-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
    .target-adjust-grid button { min-width: 0; padding: 9px 8px; }
    .target-effect-grid { display: grid; grid-template-columns: minmax(140px,.78fr) minmax(0,1.22fr); gap: 8px; align-items: end; }
    .empty-state { border: 1px dashed rgba(148,163,184,.35); border-radius: 14px; padding: 12px; color: var(--muted); background: rgba(15,23,42,.32); }
    .log-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 8px; max-height: 320px; overflow: auto; padding-right: 2px; }
    .log-card { padding: 9px; }
    .log-card .note { font-size: .84rem; }
    .status-line { min-height: 45px; display: flex; align-items: center; border: 1px solid rgba(56,189,248,.25); background: rgba(56,189,248,.07); border-radius: 14px; padding: 10px 12px; color: var(--muted); }
    .footer { position: fixed; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 70; width: min(1210px, calc(100% - 20px)); margin: 0 auto; background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.98)); border: 1px solid rgba(56,189,248,.35); border-radius: 18px; padding: 10px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; box-shadow: 0 16px 42px rgba(0,0,0,.45); }
    .footer-title { font-weight: 900; }
    .footer-detail { color: var(--muted); font-size: .84rem; }
    .footer-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .footer-actions button { width:auto; min-width:82px; padding: 8px 10px; font-size:.85rem; }
    .footer-actions button.primary { min-width: 150px; }
    .footer-actions .footer-secondary { min-width: 64px; }
    @media (max-width: 760px) { .footer { grid-template-columns: 1fr; } .footer-actions { justify-content:flex-start; } .footer-actions button.primary { flex: 2 1 170px; } .footer-actions .footer-secondary { flex: 1 1 72px; } body { padding-bottom: 154px; } }
    .initiative-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:10px; }
    .initiative-card.current { border-color: rgba(56,189,248,.75); background: rgba(56,189,248,.09); }
    .num { width:28px; height:28px; display:grid; place-items:center; border-radius:999px; background: rgba(255,255,255,.1); color:var(--muted); font-weight:900; }
    .current .num { background:var(--accent); color:#06111f; }
    details { border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:rgba(15,23,42,.48); }
    summary { cursor:pointer; color:var(--accent); font-weight:900; }
    .table-ish { display:grid; gap:8px; }

    .result-metric { font-size: 1.18rem; color: var(--text); font-weight: 800; }
    .mini-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 12px; }
    .mini-table th, .mini-table td { border-bottom: 1px solid var(--line); padding: 8px 9px; text-align: left; vertical-align: top; }
    .mini-table th { color: var(--accent2); width: 150px; background: rgba(15,23,42,.56); }
    .mini-table tr:last-child th, .mini-table tr:last-child td { border-bottom: 0; }
    button:disabled { opacity: .56; cursor: not-allowed; filter: grayscale(.15); }

    .flow-grid.resolver-active .actor-card,
    .flow-grid.resolver-active .target-card,
    .flow-grid.resolver-active .action-card { grid-column: 1; }
    .flow-grid.resolver-active .resolve-card { grid-column: 2; grid-row: 1 / span 3; }
    .flow-grid.resolver-active .resolve-card .attack-layout { grid-template-columns: minmax(280px, .95fr) minmax(320px, 1.05fr); }
    @media (max-width: 900px) { .flow-grid, .flow-grid.resolver-active { grid-template-columns: 1fr; } .flow-grid.resolver-active .actor-card, .flow-grid.resolver-active .target-card, .flow-grid.resolver-active .action-card, .flow-grid.resolver-active .resolve-card { grid-column: auto; grid-row: auto; } }
    .formula-line { display:block; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .formula-line:last-child { border-bottom:0; }

    .attack-layout { display: grid; grid-template-columns: minmax(300px, .92fr) minmax(320px, 1.08fr); gap: 12px; align-items: start; margin-top: 10px; }
    .breakdown-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .breakdown-card { border: 1px solid var(--line); border-radius: 13px; background: rgba(2,6,23,.28); padding: 9px; }
    .breakdown-card .label { color: var(--accent2); font-size: .78rem; font-weight: 900; text-transform: uppercase; letter-spacing: .045em; margin-bottom: 4px; }
    .breakdown-card .value { color: var(--muted); font-size: .88rem; }
    .chain-helper-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 8px; }
    @media (max-width: 700px) { .chain-helper-grid { grid-template-columns: 1fr; } }
    .chain-helper-status { border: 1px solid rgba(251,191,36,.35); background: rgba(251,191,36,.08); color: var(--muted); border-radius: 12px; padding: 9px; margin-top: 8px; }
    .spend-line { display: block; margin: 2px 0; }
    @media (max-width: 860px) { .play-support-grid { grid-template-columns: 1fr; } }
    @media (max-width: 720px) {
      .battle-strip, .target-adjust-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .target-effect-grid { grid-template-columns: 1fr; }
      .attack-layout, .breakdown-grid { grid-template-columns: 1fr; }
    }

    .defense-tray { display: grid; gap: 8px; margin-top: 10px; }
    .defense-option { border: 1px solid var(--line); border-radius: 13px; background: rgba(2,6,23,.24); padding: 9px; }
    .defense-option label { color: var(--text); }
    .counter-card { margin-top: 10px; border-color: rgba(251,191,36,.42); background: rgba(251,191,36,.08); }
    .manual-modifier-block { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
    .night-tools { margin-top: 12px; border-color: rgba(167,139,250,.38); background: linear-gradient(180deg, rgba(167,139,250,.09), rgba(15,23,42,.45)); }
    .night-tool-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .life-target-grid { display: grid; grid-template-columns: minmax(150px,1.2fr) minmax(120px,.8fr) minmax(120px,.8fr) minmax(90px,.55fr); gap: 8px; align-items: end; }
    .life-row { border: 1px solid var(--line); border-radius: 13px; background: rgba(2,6,23,.26); padding: 9px; margin-top: 8px; }
    @media (max-width: 760px) { .night-tool-grid, .life-target-grid { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
  </style>
</head>

  <main id="appRoot"></main>
  <footer class="footer" id="stableFooter" aria-live="polite"></footer>
  <script src="combat-core.js"></script>

      return { title:'Rook support ready', detail:`Support target: ${target}. Confirm SOI/physical token timing, then use the buttons in Resolve / Apply.` };
    }
    if (state.ui.actionId === 'enemySpell') {
      const result = calculateEnemySpellResult();
      if (result.ready) {
        const applied = state.ui.appliedResultKey === result.key;
        const effectText = result.effect && result.failed ? `; ${result.effect}` : '';
        return { title: applied ? 'Applied enemy spell' : `${result.failed ? 'Failed Conviction' : 'Passed Conviction'} - ${result.finalDamage} damage${effectText}`, detail: `${actor} forcing ${target}. Force ${result.force} vs Conviction ${result.conviction}. ${applied ? 'This exact result has already been applied.' : 'Use Apply when ready.'}` };
      }
    }
    return { title: `${actor} - ${action}`, detail: state.ui.targetId ? `Target: ${target}.` : 'Choose a target, then an action.' };

  function actorOptionsHtml() {
    const opts = [];
    Object.values(DATA.party).forEach(p => opts.push({ value:`party:${p.id}`, label:p.name }));

    state.command
      .filter(c => !c.defeated && !c.dismissed && initKeys.has(`command:${c.defId}`))
      .forEach(c => opts.push({ value:`command:${c.id}`, label:c.label }));
    state.enemies
      .filter(e => !e.defeated && (initKeys.has(`enemy:${e.defId}`) || initKeys.has(`enemy:${e.id}`)))
      .forEach(e => opts.push({ value:`enemy:${e.id}`, label:e.label }));
    if (state.ui.actorId && !opts.some(o => o.value === state.ui.actorId)) {
      const label = actorLabel(state.ui.actorId);
      if (label && label !== 'No actor') opts.push({ value:state.ui.actorId, label:`${label} (manual)` });
    }
    return opts.map(o => `<option value="${escapeHtml(o.value)}" ${state.ui.actorId===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('');

  function selectActor(actorId) {
    state.ui.actorId = actorId;
    state.ui.actionId = null;

  function selectTarget(targetId) {
    state.ui.targetId = targetId;
    saveState(); render();
  }
  function syncActorFromInitiative(doRender=true) {
    const card = currentInitiativeCard();
    if (!card) return;
    let actorId = null;
    if (card.type === 'party') actorId = `party:${card.ref}`;
    if (card.type === 'command') {
      const c = state.command.find(x => x.defId === card.ref && !x.defeated && !x.dismissed);
      if (c) actorId = `command:${c.id}`;
    }
    if (card.type === 'enemy') {
      const e = state.enemies.find(x => (x.id === card.ref || x.defId === card.ref) && !x.defeated);
      if (e) actorId = `enemy:${e.id}`;
    }
    if (actorId) state.ui.actorId = actorId;
    if (doRender) { saveState(); render(); }
  }

    const pct = max ? Math.max(0, Math.min(100, 100 * (max-current) / max)) : 0;

    const effects = (entity.effects || []).map(e => `<span class="effect">${escapeHtml(e)}</span>`).join('');

  }

  function enemyDefFromRow(enemy) {
    if (!enemy) return null;
    if (enemy.customDef) return normalizeCustomEnemyDefinition(enemy.customDef);
    return DATA.enemyDefinitions[enemy.defId] || null;
  }
  function enemyInitiativeKey(enemy) {
    if (!enemy) return '';
    return enemy.customDef ? enemy.id : enemy.defId;
  }
  function diceColorOptions(selected='', allowNone=false) {
    const colors = Object.keys(DATA.dice).filter(c => c !== 'Black');
    const opts = allowNone ? [`<option value="" ${!selected?'selected':''}>None</option>`] : [];
    return opts.concat(colors.map(c => `<option value="${c}" ${selected===c?'selected':''}>${c}</option>`)).join('');
  }
  function customEnemyDiceOptions(index) {
    return diceColorOptions(index === 0 ? 'Green' : '', true);
  }
  function parseCustomImmunities(raw) {
    return String(raw || '').split(',').map(s => s.trim()).filter(Boolean);
  }
  function normalizeCustomCombatDice(dice) {
    const raw = Array.isArray(dice) ? dice.filter(Boolean) : [];
    const hasBlack = raw.includes('Black');
    const colored = raw.filter(c => c && c !== 'Black').slice(0, 2);
    if (!colored.length) colored.push('Green');
    if (hasBlack) colored.push('Black');
    return colored;
  }
  function normalizeCustomEnemyDefinition(def) {
    if (!def) return def;
    def.combatDice = normalizeCustomCombatDice(def.combatDice);
    return def;
  }
  function customSymbolAbilities(def) {
    const s = def?.symbolDamage || {};
    const abilities = [];
    const add = (symbol, physical, magic) => {
      physical = Number(physical || 0); magic = Number(magic || 0);
      if (!physical && !magic) return;
      const ability = { name:`Custom ${symbol}` };
      ability[symbol.toLowerCase()] = 1;
      if (physical) ability.physical = physical;
      if (magic) ability.magic = magic;
      abilities.push(ability);
    };
    add('Shield', s.shieldPhysical, s.shieldMagic);
    add('Book', s.bookPhysical, s.bookMagic);
    add('Burst', s.burstPhysical, s.burstMagic);
    return abilities;
  }
  function customEnemyAttackProfile(enemy) {
    const def = enemyDefFromRow(enemy);
    return { id:`custom_attack_${enemy?.id || 'enemy'}`, enemy:def?.id || 'custom', label:`${enemy?.label || def?.name || 'Custom enemy'} - custom attack`, dice:(def?.combatDice || []).filter(Boolean), range:'Custom enemy attack', ap:0, abilities:customSymbolAbilities(def), notes:'One-off custom enemy attack. Use manual modifiers for card text not modeled here.' };
  }
  function customEnemySpellProfile(enemy) {

          <div><label>Shield + Magic</label><input id="customEnemyShieldMagic" type="number" min="0" step="1" value="0" /></div>
          <div><label>Book + Physical</label><input id="customEnemyBookPhysical" type="number" min="0" step="1" value="0" /></div>

  function render() {

    const x = window.scrollX || 0;
    const y = window.scrollY || 0;
    render();
    requestAnimationFrame(() => window.scrollTo(x, y));
  }
  function renderNav() {
    const tabs = [ ['play','Play'], ['party','Party'], ['enemies','Enemies'], ['turn','Turn'], ['command','Command'], ['rewards','Rewards'], ['data','Data'] ];
    return `<section class="nav">${tabs.map(([id,label]) => `<button type="button" class="${state.ui.activeTab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</section>`;
  }

  }
  function renderFooter() {

        const applied = state.ui.appliedResultKey === result.key;

      }
    } else if (state.ui.actionId === 'spell') {
      const result = calculateSpellResult();
      if (result.ready) {
        const applied = state.ui.appliedResultKey === result.key;
        applyButton = `<button type="button" class="primary" data-action="apply-spell" ${applied ? 'disabled' : ''}>${applied ? 'Applied ✓' : `Apply spell`}</button>`;
      }
    } else if (state.ui.actionId === 'enemyAttack') {
      const result = calculateEnemyAttackResult();

        const applied = state.ui.appliedResultKey === result.key;
        applyButton = `<button type="button" class="primary" data-action="apply-enemy-attack" ${applied ? 'disabled' : ''}>${applied ? 'Applied ✓' : `Apply enemy ${result.finalDamage} dmg`}</button>`;

  function renderRemiZekeChainTools(actor) {
    if (actor.type !== 'party' || !['remi','zeke','shayliss'].includes(actor.id)) return '';
    const currentAttack = calculateAttackResult();
    const diff = currentAttack.ready ? currentAttack.diffHit : 0;

  function symbolText(pool) {
    return `${pool.book||0} Book, ${pool.shield||0} Shield, ${pool.burst||0} Burst${pool.skull ? ', Skull' : ''}`;
  }
  function canPay(pool, ability) {
    return (pool.book||0) >= (ability.book||0) && (pool.shield||0) >= (ability.shield||0) && (pool.burst||0) >= (ability.burst||0);
  }
  function pay(pool, ability) {
    return { book:(pool.book||0)-(ability.book||0), shield:(pool.shield||0)-(ability.shield||0), burst:(pool.burst||0)-(ability.burst||0), skull:pool.skull||0 };
  }
  function symbolCost(ability) {
    return (ability.book||0) + (ability.shield||0) + (ability.burst||0);
  }
  function maxAffordable(pool, ability) {
    const limits = [];
    if (ability.book) limits.push(Math.floor((pool.book||0) / ability.book));
    if (ability.shield) limits.push(Math.floor((pool.shield||0) / ability.shield));
    if (ability.burst) limits.push(Math.floor((pool.burst||0) / ability.burst));
    return limits.length ? Math.min(...limits) : 0;
  }
  function payTimes(pool, ability, times) {
    return {
      book:(pool.book||0) - (ability.book||0) * times,
      shield:(pool.shield||0) - (ability.shield||0) * times,
      burst:(pool.burst||0) - (ability.burst||0) * times,
      skull:pool.skull||0
    };
  }
  function aggregateChosen(chosen) {
    const map = new Map();
    chosen.forEach(a => {
      const key = a.name + '|' + (a.book||0) + '|' + (a.shield||0) + '|' + (a.burst||0) + '|' + (a.physical||0) + '|' + (a.magic||0);
      if (!map.has(key)) map.set(key, Object.assign({count:0}, a));
      map.get(key).count += 1;
    });
    return Array.from(map.values());
  }
  function formatSymbolSpend(chosen) {
    const rows = aggregateChosen(chosen || []);
    if (!rows.length) return 'No symbol damage spent.';
    return rows.map(a => {
      const cost = [`${a.book||0} Book`, `${a.shield||0} Shield`, `${a.burst||0} Burst`].filter(x => !x.startsWith('0')).join(' + ') || '0 symbols';
      const per = [`+${a.physical||0} Physical`, `+${a.magic||0} Magic`].filter(x => !x.includes('+0')).join(', ') || '+0 damage';
      const total = [`+${(a.physical||0) * a.count} Physical`, `+${(a.magic||0) * a.count} Magic`].filter(x => !x.includes('+0')).join(', ') || '+0 damage';
      return `<span class="spend-line">${escapeHtml(a.name)}: ${a.count} use${a.count===1?'':'s'} × (${escapeHtml(cost)} → ${escapeHtml(per)}) = ${escapeHtml(total)}</span>`;
    }).join('');
  }
  function optimizeSymbolSpend(profile, pool, diffHit, targetArmor, armorPiercing, manualPhysical, manualMagic) {
    const symbolDamageBonus = Number(profile.symbolDamageBonus || 0);
    const abilities = (profile.abilities || [])
      .concat(profile.otherworldlyAttack ? [{name:'Otherworldly upgrade', book:2, magic:2}] : [])
      .filter(a => symbolCost(a) > 0)
      .map(a => {
        const next = Object.assign({}, a);
        if (symbolDamageBonus && ((next.physical||0) > 0 || (next.magic||0) > 0)) {
          if ((next.physical||0) > 0) next.physical = (next.physical||0) + symbolDamageBonus;
          if ((next.magic||0) > 0) next.magic = (next.magic||0) + symbolDamageBonus;
          next.name = `${next.name} +MotV`;
        }
        return next;
      });
    let best = null;
    function score(chosen, remaining) {
      const physicalSymbols = chosen.reduce((s,a)=>s+(a.physical||0),0);
      const magicSymbols = chosen.reduce((s,a)=>s+(a.magic||0),0);
      const conditionalPhysical = (profile.conditionalPhysical||[]).reduce((sum, row) => sum + (diffHit > Number(row.minDifferenceExclusive ?? 999) ? Number(row.physical||0) : 0), 0);
      const rawPhysical = diffHit + (profile.passivePhysical||0) + conditionalPhysical + physicalSymbols + manualPhysical;
      const effectiveArmor = Math.max(0, targetArmor - armorPiercing);
      const physical = Math.max(0, rawPhysical - effectiveArmor);
      const magic = Math.max(0, (profile.passiveMagic||0) + magicSymbols + manualMagic);
      const finalDamage = Math.max(0, physical + magic);
      const spentSymbols = chosen.reduce((s,a)=>s + symbolCost(a), 0);
      return { finalDamage, physical, magic, rawPhysical, effectiveArmor, physicalSymbols, magicSymbols, conditionalPhysical, spentSymbols, chosenCount: chosen.length, remaining };
    }
    function better(candidate, incumbent) {
      if (!incumbent) return true;
      if (candidate.finalDamage !== incumbent.finalDamage) return candidate.finalDamage > incumbent.finalDamage;
      if ((candidate.physical + candidate.magic) !== (incumbent.physical + incumbent.magic)) return (candidate.physical + candidate.magic) > (incumbent.physical + incumbent.magic);
      if (candidate.spentSymbols !== incumbent.spentSymbols) return candidate.spentSymbols > incumbent.spentSymbols;
      return candidate.chosenCount > incumbent.chosenCount;
    }
    function walk(idx, remaining, chosen) {
      if (idx >= abilities.length) {
        const sc = score(chosen, remaining);
        if (better(sc, best)) best = Object.assign({ chosen: chosen.slice() }, sc);
        return;
      }
      const ability = abilities[idx];
      const max = maxAffordable(remaining, ability);
      for (let count = 0; count <= max; count += 1) {
        const next = payTimes(remaining, ability, count);
        const expanded = count ? chosen.concat(Array.from({length:count}, () => ability)) : chosen;
        walk(idx + 1, next, expanded);
      }
    }
    walk(0, Object.assign({}, pool), []);
    if (!best) {
      const effectiveArmor = Math.max(0, targetArmor - armorPiercing);
      const conditionalPhysical = (profile.conditionalPhysical||[]).reduce((sum, row) => sum + (diffHit > Number(row.minDifferenceExclusive ?? 999) ? Number(row.physical||0) : 0), 0);
      const rawPhysical = diffHit + (profile.passivePhysical||0) + conditionalPhysical + manualPhysical;
      const physical = Math.max(0, rawPhysical - effectiveArmor);
      const magic = Math.max(0, (profile.passiveMagic||0) + manualMagic);
      best = { finalDamage: Math.max(0, physical + magic), physical, magic, rawPhysical, effectiveArmor, physicalSymbols:0, magicSymbols:0, conditionalPhysical, spentSymbols:0, chosenCount:0, chosen:[], remaining:pool };
    }
    return best;
  }

        castingFace: state.enemySpell.castingFace,
        empower: state.enemySpell.empower,

        effectOverride: profile.id === 'manual_enemy_spell' ? (state.enemySpell.manualEffect || '') : (profile.effect || ''),
        manualFlatMagic: profile.id === 'manual_enemy_spell' ? state.enemySpell.manualFlatMagic : enemySpellDiceDamage(profile),
        damageEqualsDifference: profile.damageEqualsDifference || (profile.id === 'manual_enemy_spell' && state.enemySpell.damageEqualsDifference),

    return { ready:true, actor, target, profile, force, conviction, failed, difference, finalDamage, hpAfter, effect, immune, key, forceRows, damageRows, convictionRows:[`${c0Color}: ${faceLabel(conv0,0)}`, `${c1Color}: ${faceLabel(conv1,1)}`], blackSkull: !!blackFace?.skull };

  function calculateLifeGraspMulti() {
    const life = state.nightingale.life;
    const color = life.castingColor || 'Grey';
    const castFace = DATA.dice[color]?.[Number(life.castingFace||0)] || DATA.dice[color]?.[0] || {value:0};
    const blackFace = life.empower ? (DATA.dice.Black?.[Number(life.empowerFace||0)] || DATA.dice.Black[0]) : null;
    const castSymbols = {book:castFace.book||0, shield:castFace.shield||0, burst:castFace.burst||0, skull:castFace.skull||0};
    const pool = Object.assign({}, castSymbols);
    let blackForce = 0;
    if (blackFace) {
      pool.book += blackFace.book||0; pool.shield += blackFace.shield||0; pool.burst += blackFace.burst||0; pool.skull += blackFace.skull||0;
      blackForce = blackFace.skull ? 0 : (blackFace.book || 0);
    }
    const remainingBooks = Math.max(0, (pool.book||0) - blackForce);
    const otherworldlyForce = Math.min(remainingBooks, pool.shield||0);
    const force = 6 + (castFace.value||0) + blackForce + otherworldlyForce + Number(life.manualForceMod||0) + (life.boost ? 6 : 0);
    const targetResults = life.targets.map(row => {
      const ent = getEntityByTarget(row.targetId);
      if (!ent?.def || !ent?.state) return { ready:false, targetId:row.targetId, label:'-', conviction:0, damage:0 };
      const colors = ent.def.conviction || ['Purple','Purple'];
      const c0 = DATA.dice[colors[0]]?.[Number(row.c0||0)] || DATA.dice[colors[0]]?.[0] || {value:0};
      const c1 = DATA.dice[colors[1] || colors[0]]?.[Number(row.c1||0)] || DATA.dice[colors[1] || colors[0]]?.[0] || {value:0};
      const conviction = (c0.value||0) + (c1.value||0);
      const damage = Math.max(0, force - conviction);
      return { ready:true, targetId:row.targetId, label:targetLabel(row.targetId), conviction, damage, ent };
    });
    const totalDamage = targetResults.reduce((s,r)=>s+(r.ready?r.damage:0),0);
    const key = JSON.stringify({mode:'lifeMulti', color, face:life.castingFace, empower:life.empower, eFace:life.empowerFace, boost:life.boost, manual:life.manualForceMod, targets:life.targets, force, totalDamage});
    return { force, castValue:castFace.value||0, blackForce, otherworldlyForce, targetResults, totalDamage, key };
  }

  function getEntityByTarget(targetId) {
    const [type,id] = (targetId||':').split(':');
    if (type==='party') return { type, id, def:DATA.party[id], state:state.party[id] };
    if (type==='enemy') { const st=state.enemies.find(e=>e.id===id); return { type, id, def:enemyDefFromRow(st), state:st }; }
    if (type==='command') { const st=state.command.find(c=>c.id===id); return { type, id, def:DATA.commandDefinitions[st?.defId], state:st }; }
    return null;
  }
  function lowestAvailableNumber(defId) {
    const used = new Set(state.enemies.filter(e => e.defId===defId && !e.defeated).map(e=>e.number).filter(Boolean));
    let n = 1; while (used.has(n)) n += 1; return n;
  }
  function insertInitiativeCard(card) {
    const cards = state.initiative.cards;
    const idx = cards.length ? Math.min(state.initiative.currentIndex + 1, cards.length) : 0;
    cards.splice(idx, 0, card);
  }
  function ensureEnemyInitiative(defId) {
    if (!state.settings.autoAddEnemyInitiative) return;
    if (state.initiative.cards.some(c => c.type==='enemy' && c.ref===defId)) return;
    const def = DATA.enemyDefinitions[defId];
    if (!def) return;
    insertInitiativeCard({ id:uid('init'), type:'enemy', ref:defId, label:def.name });
  }
  function ensureEnemyInitiativeForRow(enemy) {
    if (!enemy) return;
    const ref = enemy.customDef ? enemy.id : enemy.defId;
    if (state.initiative.cards.some(c => c.type==='enemy' && c.ref===ref)) return;
    insertInitiativeCard({ id:uid('init'), type:'enemy', ref, label:enemy.customDef ? enemy.label : (enemyDefFromRow(enemy)?.name || enemy.label) });
  }
  function ensureCommandInitiative(defId) {
    if (!state.settings.autoAddCommandInitiative) return;
    if (state.initiative.cards.some(c => c.type==='command' && c.ref===defId)) return;
    const def = DATA.commandDefinitions[defId];
    insertInitiativeCard({ id:uid('init'), type:'command', ref:defId, label:def.name });
  }

  function cleanupEnemyInitiative() {
    const activeKeys = new Set();
    state.enemies.filter(e => !e.defeated).forEach(e => { activeKeys.add(e.defId); activeKeys.add(e.id); });
    state.initiative.cards = state.initiative.cards.filter(c => c.type !== 'enemy' || activeKeys.has(c.ref));
    if (state.initiative.currentIndex >= state.initiative.cards.length) state.initiative.currentIndex = Math.max(0, state.initiative.cards.length - 1);
  }
  function removeAllEnemyInitiative() {
    state.initiative.cards = state.initiative.cards.filter(c => c.type !== 'enemy');
    if (state.initiative.currentIndex >= state.initiative.cards.length) state.initiative.currentIndex = Math.max(0, state.initiative.cards.length - 1);
  }
  function addEnemies(defId, count=1) {
    const def = DATA.enemyDefinitions[defId];
    if (!def) return;
    for (let i=0;i<count;i++) {
      const n = lowestAvailableNumber(defId);
      state.enemies.push({ id:uid('enemy'), defId, number:n, label:`${def.name} ${n}`, damage:0, effects:[], tokens:{}, defeated:false });
    }
    ensureEnemyInitiative(defId);
    saveState(); render();
  }
  function addCustomEnemyFromForm() {
    const name = (byId('customEnemyName')?.value || 'Custom Enemy').trim();
    const id = uid('enemy');
    const combatDice = normalizeCustomCombatDice([
      byId('customEnemyDie1')?.value || '',
      byId('customEnemyDie2')?.value || '',
      byId('customEnemyAutoBlack')?.checked ? 'Black' : ''
    ]);

      id:`custom_${id}`,
      name,
      hp:Math.max(1, Number(byId('customEnemyHp')?.value || 1)),

      combatDice: combatDice.length ? combatDice : ['Green'],
      castingDie: byId('customEnemyCasting')?.value || '',
      conviction:[byId('customEnemyConv1')?.value || 'Teal', byId('customEnemyConv2')?.value || 'Green'],
      symbolDamage:{
        shieldPhysical:Number(byId('customEnemyShieldPhysical')?.value || 0), shieldMagic:Number(byId('customEnemyShieldMagic')?.value || 0),
        bookPhysical:Number(byId('customEnemyBookPhysical')?.value || 0), bookMagic:Number(byId('customEnemyBookMagic')?.value || 0),
        burstPhysical:Number(byId('customEnemyBurstPhysical')?.value || 0), burstMagic:Number(byId('customEnemyBurstMagic')?.value || 0)
      },
      resistances:[byId('customEnemyResistPhysical')?.checked ? 'Physical' : '', byId('customEnemyResistMagic')?.checked ? 'Magic' : ''].filter(Boolean),
      immunities:parseCustomImmunities(byId('customEnemyImmunities')?.value),
      tags:['Custom']
    };
    const enemy = { id, defId:'custom', customDef, number:1, label:name, damage:0, effects:[], tokens:{}, defeated:false };
    state.enemies.push(enemy);
    if (byId('customEnemyInitiative')?.checked) ensureEnemyInitiativeForRow(enemy);
    state.ui.targetId = `enemy:${enemy.id}`;
    state.ui.targetScope = 'enemies';
    saveState(); render();
    addLog('Added custom enemy', `${name}: HP ${customDef.hp}, Defense ${customDef.defense}, Armor ${customDef.armor}.`);
  }
  function summonCommand(defId) {
    const def = DATA.commandDefinitions[defId];
    const existing = state.command.find(c => c.defId === defId && !c.defeated && !c.dismissed);
    if (existing) {
      state.ui.actorId = `command:${existing.id}`;
      state.ui.targetId = `command:${existing.id}`;
      state.ui.targetScope = 'command';
      state.ui.actionId = null;
      saveState(); render();
      addLog(`${def.name} already active`, 'Loaded the existing Loyal Esper instead of creating a duplicate.');
      return;
    }
    const count = state.command.filter(c=>c.defId===defId).length + 1;
    const cmd = { id:uid('cmd'), defId, label: count>1 ? `${def.name} ${count}` : def.name, damage:0, sp:def.recovery, effects:[], tokens:{}, defeated:false, dismissed:false };
    state.command.push(cmd);
    ensureCommandInitiative(defId);
    state.ui.actorId = `command:${cmd.id}`;
    state.ui.targetId = `command:${cmd.id}`;
    state.ui.targetScope = 'command';
    state.ui.actionId = null;
    saveState(); render();
    addLog(`Summoned ${def.name}`, 'Placement/SOI and the physical Summon token were handled on the table. V3 added the Loyal Esper actor and initiative card if enabled.');
  }
  function addEffectToEntity(ent, effect) {
    if (!ent || !ent.state || !effect) return false;
    const immunities = ent.def?.immunities || [];
    if (immunities.includes(effect)) { addLog('Effect blocked by immunity', `${ent.def.name} is immune to ${effect}.`); return false; }
    if (!Array.isArray(ent.state.effects)) ent.state.effects = [];
    if (!ent.state.effects.includes(effect)) ent.state.effects.push(effect);
    return true;
  }
  function removeEffectFromEntity(ent, effect) {
    if (!ent?.state || !effect) return;
    ent.state.effects = ent.state.effects.filter(e => e !== effect);
  }
  function addTokenToEntity(ent, token) {
    if (!ent?.state || !token) return;
    ent.state.tokens[token] = (ent.state.tokens[token] || 0) + 1;
  }
  function removeTokenFromEntity(ent, token) {
    if (!ent?.state || !token) return;
    ent.state.tokens[token] = Math.max(0, (ent.state.tokens[token] || 0) - 1);
    if (ent.state.tokens[token] <= 0) delete ent.state.tokens[token];
  }


  function mutateTargetDamage(delta) {
    const ent = getEntityByTarget(state.ui.targetId);
    if (!ent || !ent.state || !ent.def) return;
    ent.state.damage = Math.max(0, Math.min(ent.def.hp || 999, (ent.state.damage || 0) + Number(delta || 0)));
    if (ent.type === 'enemy' && ent.state.damage >= ent.def.hp) ent.state.defeated = true;
    if (ent.type === 'command' && ent.state.damage >= ent.def.hp) ent.state.defeated = true;
  }
  function applyResultDamageOnce(result, defeatedTypes = ['enemy','command']) {
    if (!result?.ready || !result.key || !result.target?.state || !result.target?.def) return false;
    if (state.ui.appliedResultKey === result.key) return false;
    const ent = result.target;
    const coreApply = window.MiddaraCombatCore?.applyDamageOnce;
    const applied = coreApply ? coreApply(ent.state, ent.def, result, state.ui.appliedResultKey) : {
      applied: true,
      appliedKey: result.key,
      damage: Math.max(0, Math.min(ent.def.hp || 999, (ent.state.damage || 0) + Number(result.finalDamage || 0))),
      defeated: ((ent.state.damage || 0) + Number(result.finalDamage || 0)) >= (ent.def.hp || 999)
    };
    if (!applied.applied) return false;
    ent.state.damage = applied.damage;
    if (applied.defeated && defeatedTypes.includes(ent.type)) ent.state.defeated = true;
    state.ui.appliedResultKey = applied.appliedKey;
    return true;
  }
  function mutateTargetSp(delta) {
    const ent = getEntityByTarget(state.ui.targetId);
    if (!ent || !ent.state || !ent.def || ent.state.sp == null) return;
    ent.state.sp = Math.max(0, Math.min(ent.def.maxSp || 99, ent.state.sp + Number(delta || 0)));
  }
  function selectedTargetEffect() { return byId('targetEffectSelect')?.value || DATA.effects[0]; }
  function selectedTargetToken() { return byId('targetTokenSelect')?.value || DATA.tokens[0]; }

  function loadSpellProfile(profileId, forceMod=0) {
    const profile = DATA.spellProfiles[profileId];
    if (!profile) return;
    state.spell.profileId = profileId;
    state.spell.castingColor = profile.noCasting ? '' : (profile.defaultColor || profile.castingColors?.[0] || 'Purple');
    state.spell.castingFace = 0;
    state.spell.empower = profile.noCasting ? false : !!profile.defaultEmpower;
    state.spell.empowerFace = 0;
    state.spell.manualForceMod = Number(forceMod || 0);
    state.spell.convictionFaces = {};
    state.spell.zealousFaces = {};
    state.spell.useOptionalBonus = false;
    state.spell.previousDamage = 0;
    state.spell.zealousDistance = 1;
    state.spell.zealousDiscount = false;
    state.ui.actionId = 'spell';
    state.ui.appliedResultKey = null;
  }
  function currentAttackDifferenceHit() {
    const r = calculateAttackResult();
    return r.ready ? Number(r.diffHit || 0) : 0;
  }
  document.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-action]');

    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const status = byId('dataStatus');
    if (status) status.textContent = 'Snapshot download started. On iPad/iPhone, check Files → Downloads if Safari does not prompt.';
  }

  async function updateCache() {
    const status = byId('dataStatus');
    if (!('serviceWorker' in navigator)) { if(status) status.textContent='Service workers are not available here.'; return; }
    try {
      const reg = await navigator.serviceWorker.getRegistration() || await navigator.serviceWorker.register('service-worker.js');
      await reg.update();
      if (status) status.textContent = 'Cache update requested. Reload/reopen after GitHub Pages finishes deploying.';
    } catch (err) { if(status) status.textContent = 'Cache update failed: ' + err.message; }
  }
  async function clearCache() {
    const status = byId('dataStatus');
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.includes('middara')).map(k => caches.delete(k)));
      }
      if (status) status.textContent = 'Cached app files cleared. Local game state was not cleared.';
    } catch (err) { if(status) status.textContent = 'Cache clear failed: ' + err.message; }
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  normalizeState();
  saveState();
  render();
})();
  
  </script>
</body>
</html>
